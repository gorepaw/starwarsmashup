; Bantha mount: a Creature Handler's tamed bantha, trained to ride
; (docs/ROADMAP.md, Stage 12) and called from its item in the Mount slot like
; a speeder. Its model is the creature as `swgtool export-people` exports
; Tatooine's wildlife for the hub (game/imported_assets/terrain/...), walked
; by its own clips as it moves. Speeds are ASSUMPTIONs: a beast, not a
; repulsorlift; "boost" is a gallop. The rider straddles it as a speeder
; bike's (Galaxies' own creature ride clips are masks, not poses).

[vehicle]
Name = swg_mount_bantha
Kind = hover
Label = Bantha
MaxHealth = 3000
ForwardSpeed = 8
BoostSpeed = 11
ReverseSpeed = 2
StrafeSpeed = 1
Acceleration = 6
BoostAcceleration = 8
Deceleration = 8
Traction = 20
TurnRate = 1.4
SetAltitude = 0.05
GravityScale = 2
EnergyAutoRestore = 8
EnergyBoostDrain = 14
YawLimits = 0 0
PitchLimits = 0 0
EyePointOffset = 0 2.2 0
TrackCenter = 0 3.7 -7
RiderSeat = 0 2.35 0.1
RiderPose = human_barc_9pose
Creature = true
Model = ../imported_assets/terrain/tatooine_mos_eisley_city/people/bantha.gltf
Bounds = -1.35 0 -2.2 1.35 2.8 2.2
