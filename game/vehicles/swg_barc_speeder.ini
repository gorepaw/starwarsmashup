; BARC Speeder: one of Galaxies' personal vehicles, called from its item and
; ridden around Tatooine (docs/ROADMAP.md, Stage 6). Its model comes from your
; own Galaxies install:
;
;   swgtool export-vehicles <Galaxies files> game\imported_assets\swg_vehicles
;
; Galaxies' handling lives on its servers, not in its client files: these
; speeds are ASSUMPTIONs, set by its kind (a bike quick and nimble, a swoop
; quicker still, a landspeeder steadier). Its box is its model's, measured;
; RiderSeat puts the rider by its "player" hardpoint (where Galaxies seats
; them), feet a little under it.

[vehicle]
Name = swg_barc_speeder
Kind = hover
Label = BARC Speeder
MaxHealth = 2000
ForwardSpeed = 28
BoostSpeed = 38
ReverseSpeed = 6
StrafeSpeed = 4
Acceleration = 15
BoostAcceleration = 22.5
Deceleration = 10
Traction = 15
TurnRate = 1.5
SetAltitude = 0.8
GravityScale = 2
EnergyAutoRestore = 12
EnergyBoostDrain = 20
YawLimits = 0 0
PitchLimits = 0 0
EyePointOffset = 0 1.5 0
TrackCenter = 0 2.5 -6
RiderSeat = 0 0.5 -0.3
Model = ../imported_assets/swg_vehicles/swg_barc_speeder/swg_barc_speeder.gltf
Bounds = -0.649 0 -1.713 0.649 1.479 2.783
