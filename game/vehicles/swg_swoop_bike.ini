; Swoop: one of Galaxies' personal vehicles, called from its item and
; ridden around Tatooine (docs/ROADMAP.md, Stage 6). Its model comes from your
; own Galaxies install:
;
;   swgtool export-vehicles <Galaxies files> game\imported_assets\swg_vehicles
;
; Galaxies' handling lives on its servers, not in its client files: these
; speeds are ASSUMPTIONs, set by its kind (a bike quick and nimble, a swoop
; quicker still, a landspeeder steadier). Its box is its model's, measured;
; RiderSeat puts the rider by its "player" hardpoint (where Galaxies seats
; them), the pose lifting them from there to its seat.
; RiderPose sits them as Battlefront seats its speeder bike's rider, hands on the
; bars and no weapon out (human_speederbike_sit: its hips 0.118 m under the
; BARC pose's, which RiderSeat makes up).

[vehicle]
Name = swg_swoop_bike
Kind = hover
Label = Swoop
MaxHealth = 1200
ForwardSpeed = 32
BoostSpeed = 42
ReverseSpeed = 6
StrafeSpeed = 4
Acceleration = 18
BoostAcceleration = 27
Deceleration = 10
Traction = 14
TurnRate = 1.4
SetAltitude = 0.9
GravityScale = 2
EnergyAutoRestore = 12
EnergyBoostDrain = 20
YawLimits = 0 0
PitchLimits = 0 0
EyePointOffset = 0 1.5 0
TrackCenter = 0 2.5 -6
RiderSeat = 0 -0.132 -0.5
RiderPose = human_speederbike_sit
Model = ../imported_assets/swg_vehicles/swg_swoop_bike/swg_swoop_bike.gltf
Bounds = -0.326 0 -1.85 0.326 1.107 1.914
