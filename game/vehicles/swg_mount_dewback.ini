; Dewback mount: a Creature Handler's tamed dewback, trained to ride
; (docs/ROADMAP.md, Stage 12) and called from its item in the Mount slot like
; a speeder. Its model is the creature as `swgtool export-people` exports
; Tatooine's wildlife for the hub (game/imported_assets/terrain/...), walked
; by its own clips as it moves. Speeds are ASSUMPTIONs: a beast, not a
; repulsorlift; "boost" is a gallop. The rider straddles it as a speeder
; bike's (Galaxies' own creature ride clips are masks, not poses).

[vehicle]
Name = swg_mount_dewback
Kind = hover
Label = Dewback
MaxHealth = 2600
ForwardSpeed = 10
BoostSpeed = 14
ReverseSpeed = 2
StrafeSpeed = 1
Acceleration = 6
BoostAcceleration = 8
Deceleration = 8
Traction = 20
TurnRate = 1.5
SetAltitude = 0.05
GravityScale = 2
EnergyAutoRestore = 8
EnergyBoostDrain = 14
YawLimits = 0 0
PitchLimits = 0 0
EyePointOffset = 0 2.2 0
TrackCenter = 0 3.7 -7
RiderSeat = 0 1.7 0.2
RiderPose = human_barc_9pose
Creature = true
Model = ../imported_assets/terrain/tatooine_mos_eisley_city/people/dewback.gltf
Bounds = -1.25 0 -2.4 1.25 2.2 2.4
