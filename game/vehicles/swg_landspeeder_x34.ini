; X-34 Landspeeder: one of Galaxies' personal vehicles, called from its item and
; ridden around Tatooine (docs/ROADMAP.md, Stage 6). Its model comes from your
; own Galaxies install:
;
;   swgtool export-vehicles <Galaxies files> game\imported_assets\swg_vehicles
;
; Galaxies' handling lives on its servers, not in its client files: these
; speeds are ASSUMPTIONs, set by its kind (a bike quick and nimble, a swoop
; quicker still, a landspeeder steadier). Its box is its model's, measured;
; RiderSeat puts the rider by its "player" hardpoint (where Galaxies seats
; them), the pose lifting them from there to its seat.
; RiderPose sits them as Battlefront seats a BARC speeder's rider (ASSUMPTION).

[vehicle]
Name = swg_landspeeder_x34
Kind = hover
Label = X-34 Landspeeder
MaxHealth = 3000
ForwardSpeed = 20
BoostSpeed = 26
ReverseSpeed = 7
StrafeSpeed = 5
Acceleration = 9
BoostAcceleration = 13.5
Deceleration = 8
Traction = 12
TurnRate = 1.2
SetAltitude = 0.7
GravityScale = 2
EnergyAutoRestore = 12
EnergyBoostDrain = 20
YawLimits = 0 0
PitchLimits = 0 0
EyePointOffset = 0 1.5 0
TrackCenter = 0 3.5 -8
RiderSeat = 0.39 -0.2 -0.3
RiderPose = human_barc_9pose
Model = ../imported_assets/swg_vehicles/swg_landspeeder_x34/swg_landspeeder_x34.gltf
Bounds = -1.803 0 -2.887 1.803 1.726 2.902
