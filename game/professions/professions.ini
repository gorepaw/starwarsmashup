; Star Wars Mashup -- the profession roster (docs/PROFESSIONS.md, docs/PERKS.md).
;
; Every profession levels 1-100 on one character, uncapped. What a character
; has learned from trainers is capped instead: at most 10 perks and milestones
; across every profession (perk_cap), each learned for credits once and given
; up for free.
;
; Weapon and armor professions teach [perk]s: two at each of levels 5, 25,
; 45, 65 and 85 (Choice A and B), of which a character knows one. A weapon
; perk works with the profession's weapons; an armor perk while the loadout's
; armor is its class. Perks are sidegrades in handling, stamina and
; resistances, never raw damage or health.
;
; Every other profession teaches [milestone]s at 1 / 25 / 50 / 75 / 100, in
; order. Its level-1 milestone is its licence: without it, a character can't
; do what the profession is about (gather, craft, heal, tame, perform).
;
; Perk lines:
;   Modifier = <stat> + | - | * <n>     the character (stats as gear uses them;
;                                       the perks' own: ammo_capacity self_blast
;                                       stagger_resist slow_resist blast_shield
;                                       shield_overcharge notice slide_time
;                                       roll_chain charge radar_quiet)
;   Weapon = <field> * <n>              the profession's weapons (Archetypes;
;                                       an armor perk's: every weapon), fields:
;                                       spread heat reload recovery range speed
;                                       lunge disrupt velocity headshot crit
;                                       vehicle shield swap recoil aim reach
;                                       bloom body blast blast_damage effect
;                                       carry holster_cool flank guard block
;                                       parry combo
;   Weapon = <field> + <n>              added: ricochet pierce proximity deflect
;                                       knockback, and the switches (+ 1)
;                                       sprint_reload roll_fire holster_reload
;                                       riposte unblockable (docs/PERKS.md,
;                                       Mechanics)
;   Archetypes = ...                    a perk's handling for only these weapons
;   Needs = mechanic                    it can be learned but does nothing yet
;                                       (none now: every perk works)
;   Trigger = <when>                    it works only then (docs/PERKS.md,
;                                       Triggers): its Modifier and Weapon
;                                       lines while active; with After, Below,
;                                       Within, Chain, Chance, Aimed, Duration,
;                                       Cooldown, and what it does at once:
;                                       Stamina, Shield, Cool, Reload, Recharge,
;                                       Cloak, Mark, Crit, TargetModifier +
;                                       TargetDuration, DamageTaken, Resist,
;                                       OneHit, OncePerLife
;
; Available = false: what it's about isn't in the game yet. It's in the
; planner, but can't be levelled or learned.

[curve]
; Experience from level L to L+1: Base + PerLevel x (L - 1). Level 100 is
; 82,665 in all (ASSUMPTION: a long road, about 2,500 Tatooine creatures for
; one profession, fewer with quests, missions and battles).
Base = 100
PerLevel = 15

