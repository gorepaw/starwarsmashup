; Star Wars Mashup -- Stage 7 profession roster (docs/PROFESSIONS.md).
;
; Every profession levels 1-100 on one character, with its major unlocks at
; 1 / 25 / 50 / 75 / 100 ([milestone]s, after their [profession]) and small
; steps between them (RankEvery levels, the Rank* lines). Combat perks are
; sidegrades in handling, stamina and resistances, never raw damage or health,
; and apply only from one of a loadout's Active Specialization Slots
; (Slotted = true); an armor profession's only while that loadout's armor is
; its class.
;
; Perk lines:
;   Modifier = <stat> + | - | * <n>     the character (stats as gear uses them)
;   Weapon = <spread|heat|reload|recovery|range> * <n>
;                                       the profession's own weapons (Archetypes)
;
; Available = false: what it's about isn't in the game yet. It's in the
; planner, but can't be levelled or slotted.

[curve]
; Experience from level L to L+1: Base + PerLevel x (L - 1). Level 100 is
; 82,665 in all (ASSUMPTION: a long road, about 2,500 Tatooine creatures for
; one profession, fewer with quests, missions and battles).
Base = 100
PerLevel = 15

