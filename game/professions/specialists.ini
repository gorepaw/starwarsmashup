; Star Wars Mashup -- Stage 12: what the Wave 7B and 7C professions do
; (docs/PROFESSIONS.md, docs/ROADMAP.md). Read with professions.ini.
;
; [ability]      a profession's active kit, unlocked at one of its milestones
;                (Level; it must be learned from a trainer), in every
;                loadout.
;   Effect       buff heal heal_area damage_area hazard cleanse revive cloak
;                mark snare jump deploy strike supply vehicle_repair
;                vehicle_guard companion_repair companion_overcharge perform
;                track seeker hvt tranquilize tame sample_dna
;   Target       self ally enemy ground creature
;   Deploy       heal_aura buff_aura sensor trap spawn_beacon camp (Effect = deploy)
;   Where        both (default), match or world
;   Cooldown, Range, Radius, Duration, Amount, Delay, Channel (seconds, meters)
;   Modifier     <stat> + | * <n>: a buff's on allies, a snare's on enemies
;   XP           its profession's experience each time it does something
;
; [companion]    a creature to tame or hatch, or a droid chassis to assemble.
;                Look is its Galaxies object template (creatures: as
;                tatooine_spawns.ini names them, so wild ones can be tamed).
;                Level: Creature Handler (creatures) or Droid Operations
;                (droids) to tame / field it; BuildLevel: Droid Engineer to
;                assemble it. Mountable creatures become MountItem.
; [droid_module] a plug-in for a droid's bays (Bay core, primary or utility).
; [slice]        a Smuggler's permanent sidegrade for a weapon or armor.
; [inspiration]  an Entertainer's Inspiration on the menu (Kind combat or
;                progression, Level the performer's, Modifier lines).
;
; Numbers are ASSUMPTIONs, tuned to Battlefront's 400-health soldier.

