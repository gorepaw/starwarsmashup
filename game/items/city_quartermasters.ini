; SWBFO — city quartermasters' blueprints, and the basics
;
; docs/CRAFTING.md (Blueprints, City quartermasters). Read with the item
; catalog (swg_catalog.ini's [include]).
;
; [basic]: the one weapon of each crafting group, armor set of each class
; and Deflector Shield that any weaponsmith or armorsmith makes from level 1.
; Every other weapon, armor and shield schematic is a blueprint
; (schematics.ini), taught by one of the [blueprint]s below. Gear vendors
; and the bazaar's general store sell the basics.
;
; [blueprint]: an item a city's quartermaster sells. Town is its hub or town
; file's stem; Rank the standing with that town it needs (Neutral, Friendly,
; Honored, Revered, Exalted); Items the catalog items (id globs) whose
; schematics it teaches, a set's all at once; Name what it's called
; (default: its item's); Cost in credits (default: by its Rank, a set's
; twice). Its id is bp_<item id>, or for a set's glob (armor_ubese_*)
; bp_armor_ubese.
;
; ASSUMPTION: the ranks and the towns' stock are a starting point, to tune
; in play. Each item's rank follows its price and how exotic it is; each
; town's stock, where it is (Tusken rifles at Anchorhead, Massassi blades at
; Yavin 4, Ewok crossbows in the Ewok villages).

[basic]
Items = wp_pistol_d18, wp_carbine_laser, wp_rifle_laser_light, wp_rifle_spraystick, wp_rifle_dlt20a
Items = wp_melee_vibroblade, wp_melee_metal_staff, wp_heavy_flamethrower, wp_heavy_rocket_launcher, wp_grenade_c22
Items = armor_bone_*, armor_padded_*, armor_composite_*, psg_mark1

