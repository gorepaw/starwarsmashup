; A test piece of armor, for trying out gear statistics: light, a little
; laser protection, no slower. Not a real item: real armor comes from
; Galaxies, with stats we design.
;
; Modifier = <statistic> <+|-|*> <number>. Statistics: max_health, run_speed,
; strafe_speed, sprint_factor, sprint_strafe, jump_height, acceleration,
; max_energy, energy_restore, energy_restore_idle, energy_drain_sprint,
; mitigation (all damage), and mitigation_<type> for ballistic, laser,
; electro, bio, explosive and melee damage. Mitigation is the share of damage
; absorbed (0..0.9): general first, then by type.

[gear]
Name = test_light_armor
Slot = chest
Modifier = mitigation_laser + 0.15
