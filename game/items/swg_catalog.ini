; ---- Hit effects ----
; What a hit leaves on its target, named by an item's OnHit (ammo's, mostly:
; every gun firing it gets it). On a character, a debuff: the same effect
; refreshes, never stacks, and its time is cut by the target's
; effect_resistance. On a creature or outlaw: its slow (run_speed's
; multiplier) and damage over time.
;   Chance (of each hit, each pellet), Duration (s), DamagePerSecond,
;   DamageType, Modifier (repeatable, while it lasts).

[hit_effect]
Id = burning
Name = Burning
Chance = 1.0
Duration = 3
DamagePerSecond = 12
DamageType = laser

[hit_effect]
Id = chilled
Name = Chilled
Chance = 1.0
Duration = 2
Modifier = run_speed * 0.8
Modifier = sprint_factor * 0.9

[hit_effect]
Id = ionized
Name = Ionized
Chance = 1.0
Duration = 3
Modifier = shield_recharge * 0

