; A test piece of armor, for trying out gear statistics: heavy plate that
; soaks up damage, explosions especially, and adds health, but slows you
; down. Not a real item (see test_light_armor.ini for the format).

[gear]
Name = test_heavy_armor
Slot = chest
Modifier = mitigation + 0.2
Modifier = mitigation_explosive + 0.3
Modifier = max_health + 100
Modifier = run_speed * 0.8
Modifier = strafe_speed * 0.8
Modifier = jump_height * 0.7
Modifier = energy_restore * 0.75
