[quest]
Id = dath_rancor_hide
Title = A Rancor's Hide
Level = 8
Giver = Ranger Tavi Orn
Requires = dath_spider_canyon
Summary = Nothing on Dathomir is hunted with more respect than the rancor, and nothing pays better. Orn has a buyer for a rancor's hide, and no illusions about what it takes to bring one down: a lair of them nests in the hills west of the Trade Outpost, and a hunter who goes alone doesn't come back.
Done = Orn lays a hand on the hide and is quiet for a moment. "Well. There's your name, then. The ones who bring these in, we remember."
Credits = 1100
