[quest]
Id = dath_witches
Title = Roadside Witches
Level = 5
Giver = Sergeant Halvik Roe
Summary = Sergeant Roe was posted to Dathomir to guard a survey that left a year ago, and he has stayed because the transport home hasn't come. The Nightsisters have taken to waylaying the outpost's carts on the southern road, and the sergeant would very much like to know what they want with cart-loads of cabbage.
Done = Roe turns a charm over in his fingers. "Bone and thread and spite. Well. They'll think twice before the next cart. Thank you."
Credits = 600
Xp = 280
