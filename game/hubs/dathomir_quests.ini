; Quests around Dathomir's outposts and prison (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are the Science Outpost's, Trade
; Outpost's and Imperial prison's [npc]s; the creatures, gangs and camps are
; dathomir_spawns.ini's. Inspired by the kinds of trouble Galaxies' Dathomir
; had (a hard world of rancors and spiders, the Nightsisters and the Singing
; Mountain clan at odds on it, an Imperial prison whose inmates get out),
; written anew for this game: the people, their words and the steps are ours.

[quest]
Id = dath_arrival
Title = Welcome to the Science Outpost
Level = 1
Giver = Administrator Tevar Quill
Summary = Dathomir doesn't forgive carelessness, and the outpost's administrator would rather you learned the place before it teaches you. Tevar Quill keeps a short list for newcomers: meet the junk dealer, who buys what you drag in from the wilds, put your credits in the bank, have your clone kept at the cloning facility, and learn something from the people who teach here.
Done = Quill ticks the last line. "Good. Most of the ones who skip the list are on it again within the week, the other way round. There's always work for somebody who can shoot, if you want it."
Credits = 200
Xp = 80
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Science Outpost Junk Dealer
Text = Introduce yourself to the junk dealer, in the small house by the cloning facility

