Text = Thin the kwi herds round the walls

[step]
Kind = talk_to
Npc = Administrator Tevar Quill
Text = Report to Administrator Quill

[quest]
Id = dath_brackaset_hides
Title = Hides for the Trade Post
Level = 3
Giver = Trader Orrin Bask
Summary = Bask buys hides to send off-world, and brackaset hides sell best: soft, tough, and the animal hardly fights back. His hunters have gone quiet, so he'll pay you the hunters' rate.
Done = "Lovely hides." Bask runs a thumb along one. "These'll be on a freighter by morning, and you'll be a few credits better off."
Credits = 260
Xp = 130
Item = supply_field_rations
Item = supply_field_rations

