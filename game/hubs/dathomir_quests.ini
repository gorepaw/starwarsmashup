Title = Webs in the Canyon
Level = 5
Giver = Ranger Tavi Orn
Summary = Gaping spiders have strung the canyon south-west of the Science Outpost with webs that catch the outpost's survey drones, and they've started on the people who go after them. Tavi Orn wants a few of them gone, and a fang or three for the outpost's physician, who says the venom is worth studying.
Done = Orn wraps the fangs in cloth. "The canyon's quiet again, and the physician will be insufferable for a week. Worth it."
