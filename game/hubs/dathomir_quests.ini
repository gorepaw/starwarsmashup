Title = Hunters on the Trade Road
Level = 6
Giver = Scout Ria Calder
Summary = The Singing Mountain clan hunts the high ground north of the Trade Outpost, and lately its hunting parties have followed the trade carts down onto the road. Ria Calder doesn't think they mean to rob anyone; she thinks they mean to be seen, which, with the carts' drivers, comes to the same thing.
Done = Calder pockets the totems. "I'll see they get back to their people with a message. The road is the outpost's. The mountain is theirs."
