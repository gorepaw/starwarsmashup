[quest]
Id = dath_mite_trouble
Title = Mites in the Ore
Level = 4
Giver = Prospector Mella Voss
Summary = Mella Voss digs for the rock the outpost's generators run on, and shear mites have taken to nesting in her diggings; their purbole cousins hunt the same canyons and kill her pack animals. She wants both out of her claims.
Done = Voss spits dust. "That's the claims clear until the next brood. By then I'll have what I came for, and gone."
Credits = 420
Xp = 200
FactionPoints = 20

[step]
Kind = kill
Target = shear_mite
Count = 6
Text = Clear the shear mites out of the diggings

[step]
Kind = kill
Target = purbole
Count = 4
Text = Drive off the purboles hunting her animals

[step]
Kind = talk_to
Npc = Prospector Mella Voss
Text = Report to Prospector Voss

[quest]
Id = dath_cell_break
Title = The Cell Block Break
Level = 4
Giver = Warden Daro Kesk
Summary = A dozen of the prison's inmates walked out through a wall that wasn't built to be walked through, and now they camp in the hills east of the fence. The warden has a squad too small to chase them and an Empire that wants them back. He'll pay a bounty for each one, and he wants the ringleader's cell key, which the ringleader took with him.
Done = Kesk locks the key in a drawer. "A key like that opens one door too many. The Empire will hear that its prisoners are being looked after."
Credits = 520
Xp = 240
FactionPoints = 30

