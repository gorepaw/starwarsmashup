[quest]
Id = dath_shuttle_run
Title = A Ride to the Trade Outpost
Level = 2
Giver = Administrator Tevar Quill
Requires = dath_arrival
Summary = The Trade Outpost, far to the north-east, buys the Science Outpost's surplus, and Quill has a ledger that has to reach its trader in person. Shuttles run between the outposts' pads, and a ticket is a few credits.
Done = Bask skims the ledger and grunts. "Quill's handwriting hasn't improved. Here, for the trouble."
Credits = 220
Xp = 90

[step]
Kind = event
Target = travel
Text = Buy a shuttle ticket to the Trade Outpost at the shuttleport (E at the terminal)

[step]
Kind = talk_to
Npc = Trader Orrin Bask
Text = Hand the ledger to Trader Orrin Bask, by the Trade Outpost's starport

[quest]
Id = dath_nitch_raid
Title = Nitches in the Stores
Level = 2
Giver = Administrator Tevar Quill
Requires = dath_arrival
Summary = Baz nitches are small, quick and fond of the outpost's ration crates, and the kwi that graze round the walls are crowding out the supply carts. Quill is paying a bounty on both, out of the ration budget.
Done = Quill counts the claws you hand over. "The crates will last the month. Thank you."
Credits = 280
Xp = 120
Item = supply_field_rations

