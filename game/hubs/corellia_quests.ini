[quest]
Id = cor_bela_highlands
Title = Warden of the Highlands
Level = 7
Giver = Warden Sethsis
Summary = Selonian wardens keep the highlands round Bela Vistal's lake, and Sethsis has too few of them. Dalyrakes have been coming down off the ridges to the water, and a Hidden Dagger cell has made camp in the rocks to the south-west. He asks you to deal with both and speaks as if he were asking a favor.
Done = Sethsis lowers his head in the Selonian way. "The hive remembers its friends. The lake is quiet again."
