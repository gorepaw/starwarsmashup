[quest]
Id = cor_kv_garrison
Title = Garrison Supplies
Level = 8
Giver = Lieutenant Aris Kell
Summary = The Imperial garrison at Kor Vella has lost a convoy of supplies, and the convoy's escort, former Corsec by their kit, has not been seen since. Lieutenant Kell does not care what flag they once served. He wants the supply manifest back and the thieves' camp, west of the town, burned out.
Done = Kell reads the manifest without a flicker. "The Empire is grateful for loyal citizens." He says it like a man reading from a card, and the credits he hands over are real.
Credits = 900
Xp = 420
FactionPoints = 60

