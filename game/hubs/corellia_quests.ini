[quest]
Id = cor_doaba_grondas
Title = Grondas on the Barley
Level = 6
Giver = Hallan Ostrow
Summary = The barley round Doaba Guerfel is the best on the planet, and Hallan Ostrow will tell you so. This season, grondas have been trampling it, and the sharnaff herds that follow them finish the job. Thin both, and bring Hallan a few sharnaff hides: the co-op pays for them, and a farmer needs the money after a season like this.
Done = Hallan shakes your hand with both of his. "There will be barley this year after all. Come back at harvest and eat with us."
Credits = 500
Xp = 250
Item = supply_bacta_stim

