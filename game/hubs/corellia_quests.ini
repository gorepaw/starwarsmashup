[quest]
Id = cor_tyrena_hounds
Title = Hounds on the Road
Level = 5
Giver = Detective Rivan Sole
Requires = cor_letter_to_tyrena
Summary = Corellian slice hounds have taken to the roads outside Tyrena, and the freight drivers will not run them after dusk. Sole's budget will not cover a patrol, but it covers a bounty. Cull the pack and bring him a few fangs for the paperwork.
Done = Sole counts the fangs twice, as if one of them might change its mind. "The drivers will be back on the road tonight. I owe you a drink, and I never say that."
