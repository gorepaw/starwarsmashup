[quest]
Id = cor_hidden_daggers
Title = The Hidden Daggers
Level = 7
Giver = Detective Rivan Sole
Requires = cor_tyrena_hounds
Summary = Tyrena's starport is a good place for things to go missing, and the Hidden Daggers, a ring of knife-for-hire professionals, have been taking credit for most of it. Sole has traced their safehouse to the western hills. He wants it broken, and the ledger of contracts its enforcer keeps.
Done = Sole turns the ledger over and reads a name he plainly did not expect. "Well. That changes the afternoon." He pays you from a drawer he does not usually open.
Credits = 800
Xp = 380
FactionPoints = 60

