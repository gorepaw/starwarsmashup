; Quests around Corellia's towns (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are Coronet's, Tyrena's, Kor Vella's,
; Doaba Guerfel's and Bela Vistal's [npc]s; the creatures, gangs and camps are
; corellia_spawns.ini's. Inspired by the kinds of jobs Galaxies' Corellia gave
; (Corsec's trouble with street gangs and deserters, the Imperial garrison at
; Kor Vella, farmers' pests on the plains, the Selonians' highlands), written
; anew for this game: the people, their words and the steps are ours.

[quest]
Id = cor_arrival
Title = Welcome to Coronet
Level = 1
Giver = Sergeant Teva Ardane
Summary = Corsec keeps a sergeant on the shuttleport plaza for newcomers, and Teva Ardane has the patience for it. Coronet is a city of guild halls and long avenues: meet the junk dealer in the commerce guild, open an account at the bank, have your clone kept at the cloning facility, and learn something from one of the trainers.
Done = Ardane tips her cap. "Coronet looks after people who look after it. Captain Halvick has been wanting an extra pair of hands, if you feel up to it."
Credits = 200
Xp = 80
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Coronet Junk Dealer
Text = Introduce yourself to the junk dealer, in the commerce guild by the north shuttleport

[step]
Kind = event
Target = bank
Position = -88.47 -4573.72
Radius = 8
Text = Open an account at the bank (E at the bank terminal by the bank's foot)

[step]
Kind = event
Target = bind
Position = -500 -4500
Radius = 8
Text = Have your clone kept at the cloning facility on the west side (E at the terminal)

[step]
Kind = event
Target = learn
Text = Learn a milestone from a trainer in one of Coronet's guild halls

[step]
Kind = talk_to
Npc = Sergeant Teva Ardane
Text = Report back to Sergeant Ardane on the plaza

[quest]
Id = cor_market_thieves
Title = Thieves in the Market
Level = 2
Giver = Sergeant Teva Ardane
Requires = cor_arrival
Summary = Durni slip in off the plains and strip the market stalls of anything that smells like food, and the gubbur that follow them eat the rest. The stallholders have stopped filing complaints with Corsec and started filing them with each other. Ardane would like the herds thinned before somebody gets hurt.
Done = Ardane signs the chit with a flourish. "The stallholders will argue about something else this week. That alone is worth the credits."
Credits = 300
Xp = 150
FactionPoints = 25

[step]
Kind = kill
Target = durni
Count = 6
Text = Drive off the durni raiding the market

[step]
Kind = kill
Target = gubbur
Count = 4
Text = Thin the gubbur that follow them in

[step]
Kind = talk_to
Npc = Sergeant Teva Ardane
Text = Report to Sergeant Ardane

[quest]
Id = cor_krahbu_hides
Title = Hides for the Hatmaker
Level = 3
Giver = Orla Wen
Summary = Orla Wen cuts hats and belts for half of Coronet's avenue shops, and her good brown leather is krahbu hide. The hunters have stopped bringing it, and her apprentices are cutting gubbur scraps and hoping nobody notices. Bring her proper hides and she will see you fed and dressed.
Done = "Lovely, lovely." Orla runs a thumb down the grain and nods, then presses a bundle of rations into your hands as if it were a hat.
Credits = 240
Xp = 120
Item = supply_field_rations
Item = supply_field_rations

