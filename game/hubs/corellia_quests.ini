[quest]
Id = cor_deserters
Title = The Deserters' Redoubt
Level = 8
Giver = Captain Joren Halvick
Requires = cor_flail
Summary = Some of Corsec's own walked away from their posts after the budget cuts and took their rifles with them. They have settled in a redoubt in the rough country south-east of the city and sell protection to the farms nearby. Halvick would rather the public never learned how many badges are out there. He wants the redoubt cleared and the codebook its captain carries brought back.
Done = Halvick weighs the codebook in his hand for a long moment, then hands you a rifle from the armory rack. "Corsec thanks you. Officially, you were never there."
Credits = 1000
Xp = 450
FactionPoints = 75
Item = wp_rifle_dlt20a

