[quest]
Id = cor_letter_to_tyrena
Title = A Letter for Tyrena
Level = 3
Giver = Sergeant Teva Ardane
Summary = Corsec's Tyrena office wants an old case file hand-carried rather than sent over the wire, and Ardane has nobody to spare. The shuttleports run all day. Buy a ticket to Tyrena and put the file in Detective Sole's hands.
Done = Ardane nods when you tell her it's done. "Rivan will have grumbled about the wait. He grumbles at everything. Well done."
Credits = 250
Xp = 110

[step]
Kind = event
Target = travel
Text = Buy a shuttle ticket to Tyrena (E at the shuttleport)

[step]
Kind = talk_to
Npc = Detective Rivan Sole
Text = Deliver the case file to Detective Rivan Sole by Tyrena's east shuttleport

[quest]
Id = cor_flail
Title = Flail Money
Level = 4
Giver = Captain Joren Halvick
Requires = cor_market_thieves
Summary = The Flail, a street gang that runs protection on the avenue stalls, has pulled out to a camp on the south-eastern plains, out past the city's limits. Halvick has the warrant and no jurisdiction. You have neither, which for his purposes is better. Break up the camp and bring back the ledger their enforcers keep.
Done = Halvick leafs through the ledger and whistles. "Half of the avenue is in here. Corsec thanks you, and Corsec will pretend it doesn't know your name."
Credits = 450
Xp = 220
FactionPoints = 40

