; Quests around Endor's towns (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are the Research Outpost's, the
; Smuggler Outpost's and the Ewok villages' [npc]s; the creatures, gangs and
; camps are endor_spawns.ini's. Inspired by the kinds of jobs Galaxies' Endor
; gave (an outpost's chores, the Ewoks' hunts, the marauders and the dark
; Dulok tribes in the hills), written anew for this game: the people, their
; words and the steps are ours.

[quest]
Id = endor_arrival
Title = Landing at the Research Outpost
Level = 1
Giver = Quartermaster Dessa Rook
Summary = The Research Outpost is a fenced yard of sheds under the forest roof, and Dessa Rook, who keeps its stores, has shown every new arrival round it since the first survey team. Meet the junk dealer in the cloning facility's shed, put some credits in the bank south of the starport, have your clone kept in that same shed, and ask any of the trainers in the sheds and the house what they can teach you.
Done = Dessa ticks you off on a slate. "That's the whole outpost. Everything past the fence wants to eat you, so I'd start with the small things. Come back when you've had a look."
Credits = 200
Xp = 80
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Research Outpost Junk Dealer
Text = Introduce yourself to the junk dealer, in the cloning facility's shed north-west of the starport

[step]
Kind = event
Target = bank
Position = 3238 -3502
Radius = 8
Text = Open an account at the bank terminals south of the starport (E at the terminal)

[step]
Kind = event
Target = bind
Position = 3200 -3442
Radius = 8
Text = Have your clone kept at the cloning facility (E at the terminal)

[step]
Kind = event
Target = learn
Text = Learn a milestone from a trainer, in the sheds south of the starport or the house to the north

[step]
Kind = talk_to
Npc = Quartermaster Dessa Rook
Text = Report back to Quartermaster Rook on the open ground by the shuttle pad

[quest]
Id = endor_outpost_pests
Title = Raiders in the Stores
Level = 2
Giver = Quartermaster Dessa Rook
Requires = endor_arrival
Summary = Something is getting into the outpost's ration crates at night, and the footprints are squills' and gurrecks'. The fence keeps out whatever's large; it doesn't keep out these. Dessa will pay for every one that stops coming back.
Done = "The crates held their seals last night," Dessa says, and counts the credits into your palm herself. "That's the first quiet week I've had since the rains."
Credits = 280
Xp = 130

[step]
Kind = kill
Target = squill
Count = 5
Text = Kill the squills in the forest around the outpost

[step]
Kind = kill
Target = gurreck
Count = 4
Text = Thin out the gurrecks

[step]
Kind = talk_to
Npc = Quartermaster Dessa Rook
Text = Report to Quartermaster Rook

[quest]
Id = endor_smuggler_run
Title = A Parcel for the Smugglers
Level = 4
Giver = Quartermaster Dessa Rook
Requires = endor_arrival
Summary = The Research Outpost and the Smuggler Outpost don't officially know each other, which is why Dessa's crates of spare parts go by shuttle in a sealed parcel. Take the parcel across the moon to Jorrun Vask, who'll know what to do with it, and don't ask what he pays for it.
Done = Jorrun weighs the parcel in one hand and grins. "Right on time. Dessa's the only honest supplier I've got, and I'd thank you not to tell anyone."
Credits = 300
Xp = 150

[step]
Kind = go_to
Position = 3260 -3440
Radius = 10
Text = Go to the shuttle pad, north-east of the starport

[step]
Kind = event
Target = travel
Text = Buy passage to the Smuggler Outpost (E at the shuttle terminal)

[step]
Kind = talk_to
Npc = Fixer Jorrun Vask
Text = Hand Dessa's parcel to Fixer Jorrun Vask, by the mission terminals

[quest]
Id = endor_lakeside_friends
Title = Friends by the Water
Level = 3
Giver = Scout Ilen Varga
Requires = endor_arrival
Summary = The scouts at the Research Outpost get on with the Gondula Ewoks of the lake because someone once went round with gifts and no weapon drawn. Ilen wants that to stay true. Walk west to the Gondula lakeside village, over its rope walkways, and bring Fisher Teebu the outpost's greeting.
Done = Teebu listens to the whole greeting, chittering softly, then pats your arm. "Good. Outposters who walk and do not shoot. Sit. There is fish."
Credits = 220
Xp = 110

[step]
Kind = go_to
Position = 1437 -3283
Radius = 50
Text = Find the Gondula Ewok lakeside village, west of the outpost

[step]
Kind = talk_to
Npc = Fisher Teebu
Text = Speak to Fisher Teebu, on the platforms over the lake

[quest]
Id = endor_boar_wolves
Title = Wolves at the Fishing Platforms
Level = 5
Giver = Fisher Teebu
Requires = endor_lakeside_friends
Summary = Boar wolves have found that fishers carry fish. They come down to the shore at dusk, and the Ewoks, who are small, have stopped going to the nets. Teebu will trade you good lake-fish and better credits for a few tusks, as proof, and some quiet on the shore.
Done = Teebu turns a tusk over in tiny hands and nods, satisfied. "Big. Very big. You are a friend of the lake."
Credits = 360
Xp = 190
Item = supply_field_rations

