[quest]
Id = endor_marauder_beacons
Title = The Marauders' Marks
Level = 5
Giver = Scout Ilen Varga
Requires = endor_arrival
Summary = Marauders have been scratching marks into the outpost's survey beacons, and then stealing them. Ilen thinks it means a camp is planned near the pads, and a damaged beacon in the right hands would tell her where. Find the marauders' camp east of the outpost, break it, and bring back a beacon.
Done = Ilen turns the beacon over and reads the scratches by lamplight. "Their next camp, and the one after. This is better than a map. You've earned your pay twice over."
Credits = 450
Xp = 220
FactionPoints = 40

