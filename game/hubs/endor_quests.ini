[quest]
Id = endor_grove_bolma
Title = Hooves in the Grove
Level = 6
Giver = Elder Mitta
Requires = endor_arrival
Summary = The Central Panshee Ewoks keep a berry grove beneath the great trees, and a herd of bolma has found it. A bolma doesn't mean harm; it is simply the size of a hut, and the grove is not. Elder Mitta would like the herd moved on, and the hides, which her weavers can use, brought to her.
Done = Mitta runs a small hand over the thick hide and murmurs to the weavers waiting behind her. "The grove will grow back. And the hide will be a good roof for a new hut. Thank you, tall one."
Credits = 420
Xp = 200
FactionPoints = 30

