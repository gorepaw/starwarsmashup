[quest]
Id = endor_gorax_hunt
Title = Something Big in the Hills
Level = 9
Giver = Fixer Jorrun Vask
Requires = endor_pirate_cache
Summary = A gorax is a thing you hear before you see it: a giant of the high forest, fur like a thatch. A buyer on the next ship wants a gorax pelt for his hall and has paid Jorrun a deposit he'd like to keep. You've shown you can do the walking.
Done = Jorrun spreads the matted fur over a crate and looks at it for a long moment. "Well. That'll do for a hall. Take your cut, and take it quickly, before I think about what it cost."
Credits = 900
Xp = 400
FactionPoints = 60
