[quest]
Id = endor_korga_spears
Title = Spears in the Dark
Level = 7
Giver = Hunter Rokka
Requires = endor_arrival
Summary = The Korga Duloks, the dark tribe of the high forest, have taken to ambushing the Panshee Ewoks' hunting parties. Rokka's people don't fight the Duloks if they can help it; Rokka would like you to do it for them, and bring back the bone charms the Korga wear, so the elders can see whose they are.
Done = Rokka lays the charms out on a flat stone and studies each one in silence. "Korga. Their hunters from the high camp. You have bought our people a season of safe trails."
Credits = 600
Xp = 280
FactionPoints = 45

