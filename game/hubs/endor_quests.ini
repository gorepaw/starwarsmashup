Title = The Captain's Cache
Level = 6
Giver = Fixer Jorrun Vask
Requires = endor_smuggler_run
Summary = One of the Smuggler Outpost's pirate captains has gone into the forest with a strongbox that isn't entirely his. Jorrun knows where his camp is, and wants the cache's key, and he's too well known to be seen going after it.
Done = Jorrun turns the brass key over and whistles. "He kept it round his neck, did he? Next time I'll ask you before I ask a captain."
