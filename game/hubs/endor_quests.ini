[quest]
Id = endor_net_pests
Title = Teeth in the Nets
Level = 3
Giver = Net-Mender Wippa
Summary = Wippa mends the nets of the Gondula fishing village, and lately she has more mending than fishing: squills and gurrecks come out of the reeds at night and chew through them. She's counted every mesh. Bring her squill teeth for the thread-weights, and the nets will outlast the winter.
Done = Wippa weaves a squill tooth into a new net, tests the weight, and beams. "Better than stone. The village will mend again. Thank you, tall one."
Credits = 260
Xp = 120
Item = supply_field_rations

