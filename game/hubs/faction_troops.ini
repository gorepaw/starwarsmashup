; Faction troopers for the imperial and rebel mission terminals' destroy
; missions (docs/PROFESSIONS.md, Faction terminals). Every planet's hub loads
; this beside its own spawns; nothing here spawns on its own (no [camp] names
; them), only a mission's squad: an Imperial terminal sends you against
; rebels, a Rebel terminal against imperials. Bounty marks never use them.
; The same keys as a [bandit_type], with Faction.

; ---- Imperial ----

[bandit_type]
Id = faction_stormtrooper
Name = Stormtrooper
Gang = Imperial Army
Faction = imperial
Template = object/mobile/shared_dressed_stormtrooper_m.iff
Tier = 1
Health = 240
Difficulty = normal
Weapon = wp_rifle_e11
FireRange = 40
AggroRadius = 38
LeashRadius = 90
Xp = 60

