[quest]
Id = lok_outpost_letter
Title = A Letter for the Outpost
Level = 3
Giver = Tobin Rask
Requires = lok_welcome
Summary = The Imperial garrison on Lok buys supplies from the Stronghold and complains about the prices by letter, and Tobin Rask prefers to deliver his answers in person. Take the shuttle to the Imperial Outpost, find Lieutenant Calder, and tell her that the price is the price. Then come back and tell Rask how she took it.
Done = Rask laughs at your account of Calder's face. "Good. She'll be back with an offer. She always is."
Credits = 250
Xp = 110
FactionPoints = 20

