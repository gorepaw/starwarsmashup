[quest]
Id = lok_kimogila_hunt
Title = Kimogila Season
Level = 9
Giver = Mirra Vahn
Requires = lok_gurk_trouble
Summary = Mirra Vahn has hunted the badlands for longer than the Stronghold has had a cantina, and she says the kimogila are the only thing on Lok worth the trouble: a house-sized lizard with a bad temper and scales that the armorers will pay a fortune for. She wants two of them down, and two scales as proof. She won't come along. She says she's seen what happens to the second person on a hunt.
Done = Vahn weighs a scale in one hand and whistles. "Armorers will fight over these. Take the good rifle, you earned it."
Credits = 1200
Xp = 560
FactionPoints = 60
Item = wp_rifle_dlt20a

