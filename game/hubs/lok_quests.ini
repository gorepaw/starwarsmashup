Text = Bring the talons to Orrin Dace

[quest]
Id = lok_gurk_trouble
Title = Gurks in the Gears
Level = 3
Giver = Brakka Voss
Summary = Brakka Voss runs Nym's errands in the Stronghold, which means nobody argues with him and nobody asks what the errands are. Today's is simple: Nym's survey crews are being driven off their claims by gurks, big shaggy brutes with a temper, and by the spined snakes that nest in the rocks the gurks leave alone. Clear the claims.
Done = Voss nods once, which from him is a speech. "Nym pays his debts. Here's what's owed you."
Credits = 350
Xp = 170
FactionPoints = 20
Item = supply_bacta_stim

