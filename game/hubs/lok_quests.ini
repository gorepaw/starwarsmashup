[quest]
Id = lok_scrap_run
Title = The Scrapyard Ledger
Level = 5
Giver = Old Mawl
Summary = Old Mawl has run the scrapyard at the landing pad since before the pad had a name, and he says Nym's raiders have been stripping it faster than he can sell it. He's kept a ledger of everything they took, or rather they have, and he wants it back so he can show Nym's people what is owed.
Done = Mawl wets a thumb and pages through the ledger. "Every bolt," he mutters. "Every damned bolt." He counts out your fee in coin and tosses in a medpac.
Credits = 550
