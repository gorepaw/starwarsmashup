[quest]
Id = lok_flits_and_vesps
Title = Wings in the Wiring
Level = 2
Giver = Orrin Dace
Summary = Orrin Dace keeps the Stronghold's lights on with a handful of wind generators and a great deal of cursing. Flits nest in the cable runs and chew the insulation, and the vesps that follow them in build their hives in the housings. He'd do it himself but he gets stung. You won't mind.
Done = Dace flips a switch, and the lamps on the pad flicker, steady, and stay on. "First time in a week," he says, and pays you out of a jar.
Credits = 300
Xp = 150

[step]
Kind = kill
Target = flit
Count = 6
Text = Kill the flits chewing the cables

[step]
Kind = kill
Target = vesp
Count = 4
Text = Clear the vesps out of the generator housings

[step]
Kind = talk_to
Npc = Orrin Dace
Text = Report to Orrin Dace

[quest]
Id = lok_perlek_flats
Title = The Survey Line
Level = 4
Giver = Orrin Dace
Requires = lok_flits_and_vesps
Summary = Dace wants to run a power line out across the flats to the mining camps, and the survey crews keep coming back with their instruments in pieces: the perleks that hunt the flats treat a tripod as a challenge. Thin them out, and bring Dace a few talons to prove you were there.
Done = "Talons," Dace says, turning one over. "Charming. The survey can start Monday." He pays you in credits and a medpac.
Credits = 400
Xp = 200
Item = supply_medpac_adv

