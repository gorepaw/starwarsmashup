[quest]
Id = lok_nym_contract
Title = Nym's Contract
Level = 7
Giver = Brakka Voss
Requires = lok_gurk_trouble
Summary = Nym wants the flats cleared of langlatches and the kusak packs that follow the herds in, because the pirate camps pay their tithe in cargo and the cargo keeps getting eaten. Voss will have you prove it with a kusak fang, and then you carry the tally to the Pirate Outpost, east across the flats, where Quartermaster Tarn keeps Nym's books.
Done = Voss reads the tally, then reads you. "Tarn says you didn't stop to rob anyone on the way. I'll remember that." He hands you a carbine from under the counter.
Credits = 800
Xp = 380
FactionPoints = 40
Item = wp_carbine_ee3

