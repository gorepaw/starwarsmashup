[quest]
Id = lok_calder_corsairs
Title = Convoys and Cutthroats
Level = 6
Giver = Lieutenant Rhea Calder
Requires = lok_outpost_letter
Summary = Canyon Corsairs have been taking Imperial supply convoys on the road south of the outpost. Lieutenant Calder can't spare the troopers to chase them into the canyons, and she can't be seen to hire anyone either. She is, however, perfectly willing to pay for a corsair manifest that happens to fall into her hands.
Done = Calder reads the manifest and her mouth thins. "Three convoys, and they knew the routes. Somebody in the outpost is talking. Thank you, you've been more help than you know."
Credits = 700
Xp = 330
FactionPoints = 60

