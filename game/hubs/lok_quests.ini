; Quests around Lok's towns (core::QuestBook; the format is tatooine_quests.ini's).
; Their givers are Nym's Stronghold's, the Imperial Outpost's, Scrapyard Landing's and the
; Pirate Outpost's [npc]s; the creatures, gangs and camps are lok_spawns.ini's. Inspired
; by the kinds of jobs Galaxies' Lok gave (Nym's pirates and their stronghold, the
; Imperial garrison's war on the Canyon Corsairs, the kimogila hunters of the badlands),
; written anew for this game: the people, their words and the steps are ours.

[quest]
Id = lok_welcome
Title = Landfall at Nym's Stronghold
Level = 1
Giver = Tobin Rask
Summary = Nobody comes to Lok by accident, and Tobin Rask has met every one of the ones who stayed. The Stronghold is a town of pirates, prospectors and people who owe somebody money, and it runs on a few simple rules: sell your scrap to the junk dealer in the hotel, keep your credits at the bank on the plaza, have your clone kept at the cloning facility in the west of the town, and learn a trade before the wastelands teach you a harder one.
Done = Rask grins. "Four rules, and you've kept all of them. You may last the month. Come back when you want work that pays."
Credits = 200
Xp = 80
Item = supply_bacta_stim

