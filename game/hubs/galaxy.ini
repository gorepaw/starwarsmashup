; The galaxy (Stage 13): each planet a hub on a world server of its own, the
; first the home one (where new characters start). Bake and Hub are relative
; to this file. Loaded by swm_server --galaxy (and the game when it hosts).
;
; Starship fares between planets' starports, both ways, from Galaxies'
; datatables/travel/travel.iff (a planet pair without one has no route).

[planet]
Name = Tatooine
Bake = ../imported_assets/terrain/tatooine
Hub = mos_eisley.ini

[planet]
Name = Naboo
Bake = ../imported_assets/terrain/naboo
Hub = theed.ini

[fare]
From = Tatooine
To = Naboo
Credits = 500
