; Endor's hub (Stage 13): the Research Outpost, with the planet's other
; towns (Town = lines). Positions are Galaxies world coordinates (x z): the
; outposts' names, centers and extents from datatables/clientregion/endor.iff,
; the Ewok villages' from the world snapshot's clusters (names from
; string/en/endor_region_names.stf), the rest from snapshot/endor.ws.

[hub]
Name = Research Outpost
Center = 3221 -3471
Spawn = 3256 -3440
Radius = 100
CloningFacility = 3200.0 -3442.0
Town = endor_smuggler_outpost.ini
Town = endor_panshee_village.ini
