[quest]
Id = dearic_sif_ledger
Title = The Sif Ledger
Level = 6
Giver = Rennick Oss
Summary = Rennick Oss used to count the pay for the Sif's hired guns, until the accounts stopped adding up and he stopped being welcome. The mercenaries still ride a patrol out west of the city, and their sergeants carry the ledger that would prove who has been skimming. He wants a page of it.
Done = Oss reads the page twice, then folds it away. "There it is. Eleven years of other people's lies in a single column. Thank you."
Credits = 600
Xp = 280

