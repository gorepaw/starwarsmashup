[quest]
Id = dearic_letter_to_nashal
Title = A Letter to Nashal
Level = 2
Giver = Marshal Teran Vale
Requires = dearic_arrival
Summary = Nashal's reeve and Vale trade letters by hand, because telegrams get read. Vale would like you to learn the shuttles instead of walking a hundred kilometers: take the letter from Dearic's shuttleport.
Done = Voss reads the letter, grunts, and reads it again. "Vale never writes anything short. Stay a while: Nashal has work for anyone who'll take it."
Credits = 250
Xp = 120

