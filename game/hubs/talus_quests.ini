[quest]
Id = dearic_binayre
Title = The Binayre Hideout
Level = 4
Giver = Marshal Teran Vale
Requires = dearic_arrival
Summary = The Binayre crews raid the freight wagons on the southern road and run back to a camp in the hills. Vale can't touch them outside the city's limits. You can.
Done = "Fewer wagons lost this week," Vale says, with the faintest of smiles. "I'll take that. The Binayre will take it less well."
Credits = 450
Xp = 220

