; Quests around Talus's towns (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are Dearic's, Nashal's and the Imperial
; Outpost's [npc]s; the creatures, gangs and camps are talus_spawns.ini's.
; Inspired by the kinds of jobs Galaxies' Talus gave (Dearic's trouble with the
; Binayre pirates and the Sif's hired guns, the Aakuan cultists in their caves,
; the Lost Aqualish out of their old stronghold, pests on the farm roads),
; written anew for this game: the people, their words and the steps are ours.

[quest]
Id = dearic_arrival
Title = Welcome to Dearic
Level = 1
Giver = Marshal Teran Vale
Summary = Dearic keeps a marshal on the shuttleport plaza for newcomers, and Teran Vale has a short speech about the rules and a longer one about the pirates. Before either, find your feet: meet the junk dealer in the commerce guild, open an account at the bank in the middle of the old town, have your clone kept at the cloning facility on the west side, and learn something from a trainer in one of the guild halls.
Done = Vale nods slowly. "You've seen the city; the city's seen you. There's work if you want it: Deputy Marsk has farmers shouting at her about the kima, and the Binayre crews have been getting bold."
Credits = 200
Xp = 80
Item = supply_bacta_stim

