[quest]
Id = nashal_pelts
Title = Pelts for the Cold Season
Level = 3
Giver = Trader Hennet Brisk
Summary = Hennet Brisk sells coats to the whole eastern district, and his stock of sludge panther pelts is down to a rag. Panthers keep to the wet ground and don't enjoy being found. Bring him the hides, and he'll find something to pay you with.
Done = Brisk runs a thumb across a pelt and grunts approvingly. "Dense. Good. The winter buyers will think I'm a magician."
Credits = 280
Xp = 130
Item = supply_field_rations

