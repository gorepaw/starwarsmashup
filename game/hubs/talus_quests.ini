[quest]
Id = dearic_farm_roads
Title = Kima on the Farm Roads
Level = 2
Giver = Deputy Ilene Marsk
Summary = The farm roads out of Dearic are fenced with nothing but good intentions, and the kima herds have worked that out. Fynocks nest in the culverts and nip at anyone who walks past. Deputy Marsk can spare neither officers nor patience, so she is paying someone else.
Done = Marsk tallies the farmers' complaints on her fingers and runs out of fingers to put away. "Fewer of those by Friday. I'll tell them it was the weather."
Credits = 300
Xp = 150

[step]
Kind = kill
Target = kima
Count = 6
Text = Thin the kima herds on the farm roads

[step]
Kind = kill
Target = fynock
Count = 4
Text = Clear the fynocks from the culverts

[step]
Kind = talk_to
Npc = Deputy Ilene Marsk
Text = Report to Deputy Marsk

[quest]
Id = dearic_feathers
Title = Feathers for the Milliner
Level = 3
Giver = Mira Tolland
Summary = Mira Tolland makes hats for half the guild halls, and the fashion this season is murra feathers, long and green-black, plucked fresh. Her usual hunters have moved on to better-paid work. She will pay in rations and flattery.
Done = Mira turns a feather in the light and sighs happily. "Perfect. You have an eye. Here, take something for the road."
Credits = 240
Xp = 120
Item = supply_field_rations
Item = supply_field_rations

