[quest]
Id = outpost_aakuan
Title = The Aakuan Idol
Level = 8
Giver = Lieutenant Sorrel Daan
Summary = The Aakuan call themselves a congregation. Lieutenant Daan calls them cultists who have been raiding the outpost's supply convoys for a carved idol, which they seem to think the Imperial garrison is hiding. He would like the raiders stopped, and the idol they carry to his desk, so that the Empire can find out what it is that they are dying for.
Done = Daan sets the idol on his desk and regards it with weary distaste. "A lump of painted wood. Remarkable what men will kill over. The Empire is in your debt."
Credits = 900
Xp = 400
Item = wp_rifle_e11

