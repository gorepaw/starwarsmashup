Id = nashal_aqualish
Title = The Lost Aqualish
Level = 7
Giver = Reeve Calder Voss
Requires = nashal_pirates
Summary = Out past the eastern ridge, a party of aqualish has dug in around an old stronghold. They call themselves lost; the reeve calls them armed. They have started turning back travelers, and a few have not come back. He wants them moved on, one way or the other.
Done = Voss reads your report and puts down his pen. "Moved on. That's as much as I can say in writing. Thank you."
