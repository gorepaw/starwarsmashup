[quest]
Id = yavin4_choku_raid
Title = The Choku Raids
Level = 3
Giver = Storekeeper Wenn Arrow
Requires = yavin4_labor_arrival
Summary = Packs of choku come down out of the hills at night and tear the store's grain sacks to ribbons, and one took a crewman's hand last week. Wenn Arrow can't spare the crews to hunt them. You can. Bring back fangs as proof, the nastier the better.
Done = Arrow weighs the fangs in his palm. "A dozen sacks' worth, right there. Take this, and thanks."
Credits = 340
Xp = 160
FactionPoints = 25

