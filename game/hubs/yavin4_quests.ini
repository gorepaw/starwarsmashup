Title = Pirates on the Labor Road
Level = 7
Giver = Storekeeper Wenn Arrow
Requires = yavin4_choku_raid
Summary = Jungle pirates have been waiting on the road north of the labor camps and taking whatever the supply speeders carry, trinkets and all. Their camp is a day's walk north-east. Wenn Arrow would like the pirates gone and, if it's not too much to ask, the stolen trinkets back.
Done = "Not a speeder lost this week," Arrow says. "I could kiss you. I won't. Here."
