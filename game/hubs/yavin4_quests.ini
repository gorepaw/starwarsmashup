; Quests around Yavin 4's outposts (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are the Mining Outpost's, the Labor
; Outpost's and the Imperial Outpost's [npc]s; the creatures, gangs and camps
; are yavin4_spawns.ini's. Inspired by the kinds of jobs Galaxies' Yavin 4
; gave (a moon of jungle, mining and labor camps, an Imperial garrison, and the
; ancient Massassi temples left standing in the trees), written anew for this
; game: the people, their words and the steps are ours.

[quest]
Id = yavin4_mining_arrival
Title = Welcome to the Mining Outpost
Level = 1
Giver = Foreman Dessa Korr
Summary = Everything at the Mining Outpost comes in on one landing pad, and Dessa Korr meets whoever steps off it. She won't pay for a loafer's lunch, but she'll show you the place: the junk dealer who buys what you haul out of the jungle, the bank at the head of the crafting yard, the clone vats at its far end, and the trainers who'll sell you a trade.
Done = Korr gives you a short nod. "That's the whole outpost, near enough. The jungle's the rest of it, and it doesn't care who you are. Hale Brannock has pests that need seeing to."
Credits = 200
Xp = 80
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Mining Outpost Junk Dealer
Text = Introduce yourself to the junk dealer, in the crafting yard south of the starport

[step]
Kind = event
Target = bank
Position = -307.97 4854.01
Radius = 8
Text = Put a few credits in the bank at the head of the crafting yard (E at the terminal)

[step]
Kind = event
Target = bind
Position = -353 4840
Radius = 8
Text = Have your clone kept at the cloning facility at the far end of the yard (E at the terminal)

[step]
Kind = event
Target = learn
Text = Learn a milestone from a trainer: the sheds, the cantina and the clinic have them

[step]
Kind = talk_to
Npc = Foreman Dessa Korr
Text = Report back to Foreman Korr on the starport plaza

[quest]
Id = yavin4_tailings_pests
Title = Pests in the Tailings
Level = 2
Giver = Prospector Hale Brannock
Requires = yavin4_mining_arrival
Summary = The tailings heaps on the jungle's edge are warm, and everything small and hungry on Yavin 4 has found out. Tanc mites chew through the sample bags and stintarils steal what's left. Hale Brannock has lost three weeks of assays to them.
Done = Brannock tips a sample bag out on the table: whole, for once. "Not a nibble. I'll sleep tonight."
Credits = 280
Xp = 130
FactionPoints = 25

[step]
Kind = kill
Target = tanc_mite
Count = 6
Text = Kill tanc mites in the jungle around the outpost

[step]
Kind = kill
Target = stintaril
Count = 5
Text = Kill the stintarils robbing the sample bags

[step]
Kind = talk_to
Npc = Prospector Hale Brannock
Text = Report to Prospector Brannock at the yard's south side

[quest]
Id = yavin4_crystal_assay
Title = A Crystal Scale for the Assay
Level = 4
Giver = Prospector Hale Brannock
Requires = yavin4_tailings_pests
Summary = Brannock swears the crystal snakes of the damp ground south-east of the outpost have scales that are all but transparent, and that a sheet of them makes a better lens for his field analyzer than anything the Empire ships. He needs three, and he won't go near the snakes to get them.
Done = Brannock holds a scale up to the light and grins at the pale glow. "There's my lens. And a little extra for your trouble."
Credits = 420
Xp = 190
Item = supply_field_rations

[step]
Kind = collect
Item = junk_yavin4_crystal_scale
Count = 3
DropFrom = crystal_snake
DropChance = 0.5
Text = Take crystal scales from the crystal snakes in the jungle

[step]
Kind = deliver
Item = junk_yavin4_crystal_scale
Count = 3
Npc = Prospector Hale Brannock
Text = Bring the scales to Brannock

[quest]
Id = yavin4_bat_roost
Title = Bats in the Vents
Level = 5
Giver = Foreman Dessa Korr
Requires = yavin4_mining_arrival
Summary = A roost of gackle bats has taken over the old drainage cuttings south-east of the outpost, and their droppings have fouled two of the pumps. Korr wants the roost thinned, and she'll accept proof of it: their wings, which the ore-sorters use to line their sieves.
Done = "That'll quiet the pumps," Korr says, counting the wings. "Good. Mind the wing-dust, it itches for a day."
Credits = 460
Xp = 210
FactionPoints = 35

[step]
Kind = go_to
Position = -809 4173
Radius = 60
Text = Find the roost in the cuttings south-east of the outpost

