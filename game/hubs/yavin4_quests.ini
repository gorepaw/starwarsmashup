[quest]
Id = yavin4_labor_arrival
Title = Welcome to the Labor Outpost
Level = 1
Giver = Overseer Mirra Tolle
Summary = The Labor Outpost works its crews hard and feeds them well, and Overseer Tolle holds that a new hand who can find the bank, the bed and the dealer is worth two who can't. Meet the junk dealer, bank something, have your clone kept at the facility south-east of the starport, and see where the shuttle takes you.
Done = Tolle makes a mark on her slate. "Good. You can find your way around, then. Wenn Arrow at the store is short of hands for the choku trouble."
Credits = 200
Xp = 80
Item = supply_bacta_stim

