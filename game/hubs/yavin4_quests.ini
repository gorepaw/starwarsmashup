[quest]
Id = yavin4_old_stones
Title = The Old Stones
Level = 10
Giver = Archivist Ressa Quill
Requires = yavin4_labor_arrival
Summary = Ressa Quill came to Yavin 4 for the Labor Outpost's pay and stayed for the stones. The Massassi built their great temples in the jungle long before the Empire, and nobody has measured them properly since. She wants someone to walk to the Great Massassi Temple and to the Blueleaf Temple beyond it, look at what the trees have done to them, and tell her what's still standing.
Done = Quill listens to every word and writes none of it down. "Still standing. Still beautiful. Thank you. I thought I would have to go myself."
Credits = 800
Xp = 360
FactionPoints = 40
Item = supply_medpac_adv

[step]
Kind = go_to
Position = -3038 -2960
Radius = 120
Text = Walk to the Great Massassi Temple in the jungle north-west of the Labor Outpost

[step]
Kind = go_to
Position = -830 -2056
Radius = 100
Text = Continue west to the Blueleaf Temple

[step]
Kind = talk_to
Npc = Archivist Ressa Quill
Text = Tell Ressa Quill what you saw

[quest]
Id = yavin4_deserters
Title = The Deserters' Camp
Level = 8
Giver = Lieutenant Arden Voss
Summary = Some of the garrison's soldiers walked out of the Imperial Outpost with their rifles and their rank cylinders, and set up in the jungle to the west. Lieutenant Voss can't send the patrol after them without admitting how many have gone. He'd like to see the deserters put down, and their rank cylinders returned to him.
Done = Voss takes the cylinders without looking at them. "Their families will be told it was an accident in the jungle. That's the kindest I can make it."
Credits = 700
Xp = 320
FactionPoints = 55

