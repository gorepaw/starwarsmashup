Title = The Kliknik Hive
Level = 11
Giver = Lieutenant Arden Voss
Requires = yavin4_deserters
Summary = A kliknik hive has opened in the ridges north of the Imperial Outpost, and the patrols that go near it don't always come back. The garrison can't spare the men to burn it. Voss will pay for kliknik killed and for carapace plates he can show his superiors as evidence there was a hive at all.
Done = Voss stacks the plates on his desk. "That's a hive, all right. The report will say it was cleared by the garrison, you understand."
