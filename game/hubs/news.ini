[post]
Title = Welcome to Mos Eisley!
Date = Build Dev-Stage 9
Author = Governor's Office
Body = Citizens and spacers: Starport departures, Civic Guildhalls, and the Mos Eisley Bazaar are now marked across the city.\n\nUse your Multi-Scanner (G) outside city walls to prospect Tatooine resources, craft custom gear at the differentiated public crafting stations, and visit the Ground or Space Terminals to enter the front lines.

[post]
Title = Starport Renovations Complete
Date = Notice 02
Author = Mos Eisley Port Authority
Body = Wreckage blocking the south-east Starport bay has been cleared. All Space Terminals inside the concourse remain open for Orbital Space Battles.\n\nInterplanetary shuttle schedules to Naboo, Corellia, Dantooine, and Endor will be posted here as routes open.
