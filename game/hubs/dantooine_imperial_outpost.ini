; Dantooine's hub (Stage 13): the Imperial Outpost, the planet's largest outpost, and
; its other two outposts (Town = lines). Positions are Galaxies world coordinates (x z):
; outpost centers and extents from datatables/clientregion/dantooine.iff, the rest from
; the world snapshot (snapshot/dantooine.ws).

[hub]
Name = Imperial Outpost
Center = -4224 -2400
Spawn = -4210.7 -2350.5
Radius = 250
CloningFacility = -4243.0 -2430.0
Town = dantooine_mining_outpost.ini
Town = dantooine_agro_outpost.ini
Spawns = dantooine_spawns.ini
