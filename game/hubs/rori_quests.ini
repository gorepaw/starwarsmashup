[quest]
Id = rori_to_the_outpost
Title = A Message for the Outpost
Level = 4
Giver = Dispatcher Orra Vell
Requires = rori_arrival
Summary = The Rebels keep a small outpost on the southern shore, and their lieutenant sends for anyone who can handle a blaster and isn't asking questions. Orra Vell won't say who asked her to pass the word. She'd rather you took the shuttle than guess.
Done = Doran looks you over. "Orra's recommendation, and you came by the shuttle on your own credits. Good. I have work."
Credits = 220
Xp = 110

