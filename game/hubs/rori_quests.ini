[quest]
Id = rori_spineflap_spines
Title = Spines for the Arrows
Level = 3
Giver = Trader Nim Palo
Requires = rori_restuss_arrival
Summary = Nim Palo supplies half of Restuss with arrowheads, fishing barbs and needles, and the best of all three come from capper spineflaps. The swamp has plenty. Nim has a counter to mind.
Done = "Lovely and sharp," Nim says, counting the spines into little bundles. "I'll make a month's wages out of these."
Credits = 240
Xp = 120
Item = supply_field_rations

