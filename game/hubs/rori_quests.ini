[quest]
Id = rori_kobola_ore
Title = Kobola Contraband
Level = 7
Giver = Lieutenant Cael Doran
Requires = rori_to_the_outpost
Summary = The Kobola gang digs in the mountains to the east and runs what it digs along the southern shore, past the outpost. Some of it is ore the Alliance would like to see smelted into something useful instead of sold. Doran wants the smugglers stopped and a sample of the ore.
Done = Doran weighs a lump of ore in his hand. "Not bad. It'd be better still in a Rebel cannon." He signs a requisition for you at the quartermaster's.
Credits = 640
Xp = 310
FactionPoints = 55
Item = supply_medpac_adv

