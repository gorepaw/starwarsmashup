; Quests around Rori's towns (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are Narmle's, Restuss's and the Rebel
; outpost's [npc]s; the creatures, gangs and camps are rori_spawns.ini's.
; Inspired by the kinds of jobs Galaxies' Rori gave (newcomers shown round the
; moon's two towns, the swamp's beasts, the Garyn raiders' bunker and the
; Cobral gang's hideout, the Rebels' outpost on the southern shore), written
; anew for this game: the people, their words and the steps are ours.

[quest]
Id = rori_arrival
Title = Welcome to Narmle
Level = 1
Giver = Dispatcher Orra Vell
Summary = Orra Vell meets every shuttle at Narmle, and has since before the shuttleport had a roof. The town is a spread of guild halls and clinics on dry ground in a very wet moon: meet the junk dealer in the commerce guild, put some credits in the bank, have your clone kept at the cloning facility, and learn something from one of the trainers.
Done = Orra smiles and hands you a tin cup of something hot. "Narmle's a good town for starting. The wardens have work for you whenever you've had your tea."
Credits = 180
Xp = 70
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Narmle Junk Dealer
Text = Introduce yourself to the junk dealer, in the commerce guild

