[quest]
Id = rori_restuss_arrival
Title = Welcome to Restuss
Level = 1
Giver = Marshal Ila Brandt
Summary = Restuss is smaller than Narmle, louder, and sits closer to trouble. Marshal Brandt shows newcomers the same four stops: the junk dealer in the commerce guild, the bank on the western road, the cloning facility beyond the starport, and a trainer in one of the guild halls.
Done = Brandt nods slowly. "You'll find Restuss as honest as it can afford to be. Come and see me when you want real work."
Credits = 180
Xp = 70
Item = supply_bacta_stim

