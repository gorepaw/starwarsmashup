Id = rori_cobral_ledger
Title = The Cobral Ledger
Level = 5
Giver = Marshal Ila Brandt
Requires = rori_restuss_arrival
Summary = The Cobral gang squats in a bunker south of Restuss and taxes anything that moves on the swamp road. Brandt wants the gang broken, and the boss's ledger of who pays him, so she can ask them politely to stop.
Done = Brandt turns the ledger's pages with a gloved finger and her smile gets thinner. "Oh, this is a good list. Some of these names are on the festival committee."
