[quest]
Id = rori_swamp_pests
Title = Pests of the Swamp
Level = 2
Giver = Warden Teb Marlo
Summary = The swamp wardens keep Narmle's boardwalks and fields clear, and this season there are too many squalls under the planking and too many pugoriss rooting up the vegetable beds. Teb Marlo has more fields than wardens.
Done = Teb Marlo checks the count against his tally slate. "That's a quiet week bought. Don't spend it all in one tavern."
Credits = 280
Xp = 130
FactionPoints = 20

[step]
Kind = kill
Target = squall
Count = 5
Text = Kill squalls in the swamp round Narmle

[step]
Kind = kill
Target = pugoriss
Count = 4
Text = Thin out the pugoriss

[step]
Kind = talk_to
Npc = Warden Teb Marlo
Text = Report to Warden Marlo by the shuttleport

[quest]
Id = rori_pugoriss_tusks
Title = Tusks for the Carver
Level = 3
Giver = Hunter Kesk Dorran
Requires = rori_arrival
Summary = Kesk Dorran sells carved tusk-work to every traveler who steps off a shuttle, and he's out of tusks. Pugoriss tusks, fresh enough to work. He'd go himself, but his knees have opinions.
Done = Kesk turns a tusk over in his scarred hands, pleased. "Good ivory. I'll have a comb out of this by tomorrow." He presses some rations on you for the walk.
Credits = 230
Xp = 110
Item = supply_field_rations

[step]
Kind = collect
Item = junk_rori_pugoriss_tusk
Count = 3
DropFrom = pugoriss
DropChance = 0.5
Text = Take tusks from the pugoriss round Narmle

[step]
Kind = deliver
Item = junk_rori_pugoriss_tusk
Count = 3
Npc = Hunter Kesk Dorran
Text = Bring the tusks to Kesk Dorran by the shuttleport

[quest]
Id = rori_garyn_bunker
Title = The Raiders' Bunker
Level = 6
Giver = Warden Teb Marlo
Requires = rori_swamp_pests
Summary = West of Narmle, on a rise above the swamp, stands an old concrete bunker, and the Garyn raiders have made it their own. They fall on the boardwalk traders and are back behind its walls by morning. The wardens can't spare enough men to take it. You can.
Done = Teb Marlo reads your report twice. "Six raiders and no wardens hurt. I'll buy the next round for the whole watch." He pays you from the watch's strongbox.
Credits = 520
Xp = 260
FactionPoints = 45
Item = supply_medpac_adv

