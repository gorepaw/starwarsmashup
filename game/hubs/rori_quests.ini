[quest]
Id = rori_bark_mite_cave
Title = Under the Roots
Level = 5
Giver = Trader Nim Palo
Requires = rori_spineflap_spines
Summary = Bark mites have gnawed through the stilts of the old timber road west of Restuss, and their nest is in a cave under the roots. Nim's carts can't get through until the mites are fewer.
Done = Nim counts the day's cart tolls in a ledger and laughs. "Half a day without a broken axle. A record."
Credits = 400
Xp = 200
FactionPoints = 25

