; The Legacy's sites on Talus (docs/LEGACY.md, phase 2): out in the
; country, so no town's export takes them in. rebuild_imported_assets.py
; exports each [site] with the planet's towns (export-city --site), and this
; file's [place]s stand there too: Galaxies' servers spawned most of the
; Legacy's caves and bunkers, so the world snapshot lacks them; these are
; Total Experience templates put where the quests send players (the guide's
; coordinates). Written by the Legacy site list generator, kept with the
; quest inventory outside the repo; hand edits are fine.
;
; [site]: Name, Area = x z radius (Galaxies; the snapshot's objects within it
; are exported, and rooms deeper than 6 m under the terrain keep it over them).
; [place]: Template (an object template), Position = x z (Galaxies), Yaw
; (degrees), optional Height (else on the terrain). A [place] stands in its
; [site]'s Area.

