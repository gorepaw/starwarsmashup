; The Legacy's sites on Tatooine (docs/LEGACY.md, phase 2): out in the
; country, so no town's export takes them in. rebuild_imported_assets.py
; exports each [site] with the planet's towns (export-city --site), and this
; file's [place]s stand there too: Galaxies' servers spawned most of the
; Legacy's caves and bunkers, so the world snapshot lacks them, and these are
; Total Experience templates put where the quests send players.
;
; [site]: Name, Area = x z radius (Galaxies; the snapshot's objects within it
; are exported, and rooms deeper than 6 m under the terrain keep it over them).
; [place]: Template (an object template), Position = x z (Galaxies), Yaw
; (degrees), optional Height (else on the terrain). A [place] must stand in
; a [site]'s Area (or a town's) to be exported.

; ---- In the snapshot already ----

[site]
Name = Squill Cave
; Squill Diving (part 2); the cave stands at 39 -113, the guide's waypoint 60 -87.
Area = 39 -113 60

[site]
Name = Jabba's Palace
; Jabba's Theme Park, Tracking the Head and the EV-9D9 quests (part 2).
Area = -5985 -6301 140

