Text = Bring the datapad to Captain Rook

[quest]
Id = theed_maulers
Title = The Maulers' Shrine
Level = 9
Giver = Captain Halden Rook
Requires = theed_dissident_cipher
Summary = The cipher led somewhere nobody expected: to the Maulers, a cult of fighters who camp on the northern coast and train with blades. Rook wants their encampment broken and the relic they keep there brought back, so the palace can see what they worship.
Done = Rook studies the relic for a long moment, then hands you a rifle from the armory rack. "The palace thanks you. Officially, you were never there."
Credits = 1000
Xp = 450
Item = wp_rifle_dlt20a

