; Quests around Naboo's towns (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are Theed's, Keren's, Moenia's and
; Lake Retreat's [npc]s; the creatures, gangs and camps are
; naboo_spawns.ini's. Inspired by the kinds of jobs Galaxies' Naboo gave (the
; palace's errands, the Royal Security Forces' trouble with dissidents and
; the Maulers, farmers' pests on the plains), written anew for this game:
; the people, their words and the steps are ours.

[quest]
Id = theed_arrival
Title = Welcome to Theed
Level = 1
Giver = Steward Aren Velis
Summary = The palace keeps a steward on the spaceport plaza for newcomers, and Aren Velis takes the duty seriously. Theed is a city of guild halls and quiet rules: meet the junk dealer in the commerce guild, open an account at the bank, have your clone kept at the cloning facility by the river, and learn something from one of the trainers in the guild halls.
Done = Velis inclines his head. "You'll find Theed generous to those who keep its peace. Officer Sol has been asking for help, if you've the stomach for it."
Credits = 200
Xp = 80
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Theed Junk Dealer
Text = Introduce yourself to the junk dealer, in the commerce guild west of the plaza

