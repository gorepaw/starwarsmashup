DropChance = 0.5
Text = Take kaadu hides from the kaadu on the plains

[step]
Kind = deliver
Item = junk_kaadu_hide
Count = 3
Npc = Tilla Ferrow
Text = Bring the hides to Tilla Ferrow on the plaza

[quest]
Id = theed_swoop_gang
Title = Engines After Dark
Level = 4
Giver = Officer Brenna Sol
Requires = theed_plains_pests
Summary = A swoop gang has made a camp in the hills south-west of the city and races the river roads after dark. Officer Sol can't touch them outside the city's limits. You can.
Done = "No engines last night," Sol says. "First quiet night in a month. Thank you."
Credits = 450
Xp = 220

