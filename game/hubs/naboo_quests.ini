[quest]
Id = theed_letter_to_the_lake
Title = A Letter to the Lake
Level = 2
Giver = Steward Aren Velis
Requires = theed_arrival
Summary = Old Vessa keeps the houses at Lake Retreat for the families who summer there, and the palace still sends her its letters by hand. Velis would rather you learned the shuttles than walked: take the letter from the east shuttleport.
Done = Vessa reads the letter, laughs, and reads it again. "The palace wants the lake houses ready a month early. Of course it does. Stay for tea: you came a long way down."
Credits = 250
Xp = 120

