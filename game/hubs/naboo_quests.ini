[quest]
Id = theed_plains_pests
Title = Pests on the Plains
Level = 2
Giver = Officer Brenna Sol
Summary = The farms around Theed are losing their seed stores to nunas, and ikopi herds trample whatever the nunas leave. Theed's police won't pull officers off the streets for it, so Officer Sol is paying out of the precinct's petty funds.
Done = Sol signs off on the payment with a sigh of relief. "The farmers will stop filing complaints for a week. That alone is worth it."
Credits = 300
Xp = 150

[step]
Kind = kill
Target = nuna
Count = 6
Text = Kill nunas raiding the farms

[step]
Kind = kill
Target = ikopi
Count = 4
Text = Thin the ikopi herds

[step]
Kind = talk_to
Npc = Officer Brenna Sol
Text = Report to Officer Sol

[quest]
Id = theed_kitchen_hides
Title = Hides for the Kitchen
Level = 3
Giver = Tilla Ferrow
Summary = Tilla Ferrow cooks for half the guild halls, and her famous kaadu roast needs kaadu, which the hunters have stopped bringing. Bring her kaadu hides (the rest of the animal she'll take as read) and she'll see you fed for a week.
Done = "Lovely, lovely." Tilla wraps the hides in paper as if they were jewels and presses a bundle of rations on you.
Credits = 240
Xp = 120
Item = supply_field_rations
Item = supply_field_rations

