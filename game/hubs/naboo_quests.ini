[quest]
Id = theed_dissident_cipher
Title = The Dissidents' Cipher
Level = 6
Giver = Captain Halden Rook
Summary = The Royal Security Forces believe the dissidents hiding in the hills pass orders between their cells in a cipher, written on datapads their couriers carry. Captain Rook wants one of those datapads, and he doesn't much mind how you get it.
Done = Rook turns the datapad over in his hands. "Clumsy work. They'll have changed it by morning, but by morning we'll have read it."
Credits = 600
Xp = 280

[step]
Kind = kill
Target = Naboo Dissidents
Count = 5
Text = Fight the Naboo dissidents in their hideouts

