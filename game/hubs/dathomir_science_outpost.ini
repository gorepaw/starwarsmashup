; Dathomir's hub (Stage 13): the Science Outpost, with the Trade Outpost and the
; Imperial prison (Town = lines). Positions are Galaxies world coordinates (x z):
; names, centers and extents from datatables/clientregion/dathomir.iff (the
; prison's region is "a restricted area"; its name here is ours), the rest from
; the world snapshot (snapshot/dathomir.ws).

