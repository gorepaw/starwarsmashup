; Quests around Dantooine's outposts (core::QuestBook; the format is
; tatooine_quests.ini's). Their givers are the Imperial, Mining and Agro
; Outposts' [npc]s; the creatures, tribes and camps are dantooine_spawns.ini's.
; Inspired by the kind of life Galaxies' Dantooine had (a few outposts on a quiet
; farming world of steppes, thune herds and old ruins, the Dantari tribes, the
; Jedi Temple's broken pillars), written anew for this game: the people, their
; words and the steps are ours.

[quest]
Id = dantooine_arrival
Title = Posted to Dantooine
Level = 1
Giver = Lieutenant Odan Vessk
Summary = Dantooine is the Empire's quietest posting, which is why Lieutenant Vessk takes such care over the few new faces who step off the shuttle. Meet the outpost's junk dealer, put some credits in the bank, have your clone kept at the cloning facility, and learn something from a trainer on the parade ground before the wind and the herds make up your mind about the place.
Done = Vessk looks almost disappointed that nothing went wrong. "Good. The steppes are big and nobody here will hold your hand out on them. Sergeant Marrow has a thune problem, if you want a first job."
Credits = 200
Xp = 80
Item = supply_bacta_stim

[step]
Kind = talk_to
Npc = Imperial Outpost Junk Dealer
Text = Introduce yourself to the junk dealer, in the bank building west of the parade ground

