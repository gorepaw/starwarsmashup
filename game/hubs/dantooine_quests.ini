[quest]
Id = dantooine_janta_warband
Title = The Janta Warband
Level = 8
Giver = Rancher Hob Tessaly
Requires = dantooine_bol_hides
Summary = The Janta have always kept to their caves in the east, and the ranchers have always kept to the west. Lately a Janta warband has been coming down the old trails and driving off whole herds. Hob can't fight them and the Imperials won't, but he knows a good rifle when he meets one.
Done = Hob stares east for a long moment before he speaks. "They'll be back, they always are. But not this season. Thank you."
Credits = 700
Xp = 380
FactionPoints = 45

