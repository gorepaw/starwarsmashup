Text = Report back to Lieutenant Vessk by the starport

[quest]
Id = dantooine_thune_haunch
Title = Thune for the Mess Hall
Level = 2
Giver = Sergeant Kell Marrow
Requires = dantooine_arrival
Summary = The garrison's rations came in short again and the cooks have run out of ideas. Sergeant Marrow wants fresh thune haunch for the mess hall, which means a walk out onto the grass with a rifle and a strong back. Thin the herds while you're at it: the outpost's gardens are full of them.
Done = Marrow lifts the haunches onto the mess hall cart with grudging respect. "That's the first hot dinner in a fortnight. You keep this up and the lads will stop calling you the new one."
Credits = 260
Xp = 110
Item = supply_field_rations
Item = supply_field_rations

[step]
Kind = collect
Item = junk_thune_haunch
Count = 4
DropFrom = thune
DropChance = 0.5
Text = Cut haunches from the thune that graze around the outpost

[step]
Kind = deliver
Item = junk_thune_haunch
Count = 4
Npc = Sergeant Kell Marrow
Text = Bring the haunches to Sergeant Marrow, by the starport

[quest]
Id = dantooine_kunga_scouts
Title = Kunga on the Ridge
Level = 4
Giver = Lieutenant Odan Vessk
Requires = dantooine_thune_haunch
Summary = The Kunga are one of the Dantari tribes, and for most of the year they leave the outpost alone. This season their scouts have been watching the road to the Mining Outpost and taking what they can from the ore carts. Vessk can't spare a squad to patrol it. He can spare a little extra pay.
Done = "Quiet road, for once," says Vessk. "I'd like to think they've learned. I'd bet they've only moved a few kilometers."
Credits = 420
Xp = 200
FactionPoints = 30

[step]
Kind = kill
Target = Kunga
Count = 5
Text = Drive off the Kunga scouts and hunters west of the outpost

[step]
Kind = talk_to
Npc = Lieutenant Odan Vessk
Text = Report to Lieutenant Vessk

[quest]
Id = dantooine_graul
Title = A Graul Worth Hunting
Level = 7
Giver = Sergeant Kell Marrow
Requires = dantooine_kunga_scouts
Summary = Something big has been bringing down thune on the steppes beyond the outpost's grain stores: a graul, by the size of the tracks, and the kind that starts to think of people as food. Marrow wants one off the grass and its tusks in his hand, so that the recruits believe the stories.
Done = Marrow weighs the tusk in his palm and whistles softly. "Nobody's taking that off the wall. Well done."
Credits = 600
Xp = 320
FactionPoints = 40

