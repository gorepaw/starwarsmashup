[quest]
Id = dantooine_voritor_fields
Title = Lizards in the Barley
Level = 3
Giver = Farmer Ysolde Brandt
Summary = The Agro Outpost's fields feed half the planet's garrisons, and the voritor lizards have learned it. They come up out of the grass at dusk, and by morning a row of barley is stalks. Ysolde Brandt has a rifle and no free evenings. You have the rifle, at least, and probably the evenings.
Done = "First night in a month I slept through," Ysolde says. "I'd say stay for supper, but the rows won't weed themselves."
Credits = 280
Xp = 130
Item = supply_field_rations

[step]
Kind = kill
Target = voritor_lizard
Count = 6
Text = Kill the voritor lizards that raid the fields around the Agro Outpost

[step]
Kind = talk_to
Npc = Farmer Ysolde Brandt
Text = Report to Farmer Brandt

[quest]
Id = dantooine_bol_hides
Title = Hides for the Barn
Level = 3
Giver = Rancher Hob Tessaly
Requires = dantooine_voritor_fields
Summary = Hob Tessaly's barn roof lost a winter's battle with the wind and he needs hide to patch it, which on Dantooine means bol. The wild herds range the grassland around the outpost. He asks only that you leave the calves alone, and bring him whole hides.
Done = Hob counts the hides twice, then a third time, and finally smiles. "A sound barn at last. There's a bed in the loft, if you're ever stuck for one."
Credits = 300
Xp = 140
Item = supply_bacta_stim

