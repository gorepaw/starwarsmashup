[quest]
Id = dantooine_ore_survey
Title = What the Ground Gives
Level = 1
Giver = Foreman Dross Halvane
Summary = The Mining Outpost is short of hands and shorter of surveys. Foreman Halvane has a spare scanner and a standing offer for anyone who will walk the ground and pull something useful out of it. Find a mineral deposit, extract it, and then bring him the proof that you can read the ground.
Done = Halvane turns the sample over in his gloved fingers. "Not bad for a first dig. There's good rock under this planet, if you know how to ask for it."
Credits = 150
Xp = 70
Item = supply_field_rations

[step]
Kind = event
Target = extract
Count = 2
Text = Extract minerals from the ground near the outpost (G scanner, E to extract; stand still, then move on)

[step]
Kind = talk_to
Npc = Foreman Dross Halvane
Text = Report to Foreman Halvane

[quest]
Id = dantooine_huurton_pelts
Title = Huurtons at the Ore Carts
Level = 3
Giver = Foreman Dross Halvane
Requires = dantooine_ore_survey
Summary = Huurtons den under the ore carts' loading yard, and nobody wants to be the one to pull them out. The foreman has lost two sacks of samples and a loader's boot to them already. He'll pay well for the pelts, and he'll pay in credits rather than boots.
Done = Halvane runs a hand along a pelt and nods. "Warm winter for the crews. Good work, and the yard's peaceful again."
Credits = 300
Xp = 150
Item = supply_bacta_stim

