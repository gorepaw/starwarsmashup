Count = 3
Npc = Foreman Dross Halvane
Text = Bring the pelts to Foreman Halvane

[quest]
Id = dantooine_temple_shards
Title = What the Temple Left
Level = 6
Giver = Prospector Idris Moll
Requires = dantooine_huurton_pelts
Summary = Idris Moll came to Dantooine for the ore and stayed for the ruins. Far to the east, past the grasslands, the broken pillars of the old Jedi Temple still stand among the ponds, and the quenkers there make nests out of its relics. She wants a few of the shards they carry, for her own reasons, and she doesn't care to tell you what they are.
Done = Moll takes the shards with both hands, as if they might still be warm. "Thank you. It was a good place once. It will be again, if only in somebody's notes."
Credits = 520
Xp = 280
FactionPoints = 25

