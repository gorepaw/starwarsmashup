; Quests around Mos Eisley (core::QuestBook). Inspired by the kinds of quest
; Galaxies' later updates added around the city (a guide showing newcomers
; its services, a cook's stew of worrt hides, a Hutt's jobs against the
; Valarians and the Tusken Raiders), researched online and written anew for
; this game: the people, their words and the steps are ours.
;
; [quest]: Id, Title, Giver (one of the hub's [npc]s, by Name), Summary,
; Done, Requires (quest ids, comma-separated), Repeatable, and its reward:
; Credits, Xp, FactionPoints, Item (repeated: item def ids).
; Each [step] after it is one of its steps, in order:
;   Kind = go_to    Position = x z (Galaxies), Radius (meters)
;   Kind = kill     Target = a creature or bandit type, a gang, creature,
;                   bandit or any; Count; optionally Area = x z radius
;   Kind = collect  Item; Count; optionally DropFrom (a kill target) and
;                   DropChance: while on this step, kills drop the item
;   Kind = talk_to  Npc
;   Kind = deliver  Item; Count; Npc (handed over when you talk to them)
; Text is what the quest tracker shows for the step.

[quest]
Id = stranger_in_mos_eisley
Title = A Stranger in Mos Eisley
Giver = Ilsa Marn
Summary = New faces don't last long in Mos Eisley unless somebody shows them where things are. Ilsa Marn has done it for a dozen arrivals this season, and she'll do it for you. Meet the people who buy what you drag in from the desert, find out where you'll wake up when the desert wins, and see where the work gets posted.
Done = Ilsa nods. "You'll do. There's an old speeder bike round the back that nobody's claimed in a year: take it, you'll want something faster than your feet out in the dunes. Come and find me when you've a few credits to your name."
Credits = 150
Xp = 60
Item = supply_bacta_stim
Item = vehicle_speeder_bike

[step]
Kind = talk_to
Npc = Mos Eisley Junk Dealer
Text = Introduce yourself to the junk dealer

[step]
Kind = go_to
Position = 3441.8 -5021.0
Radius = 18
Text = Find the cloning facility, south of the plaza

[step]
Kind = go_to
Position = 3420.9 -4745.1
Radius = 6
Text = Look over the mission terminal north-west of the plaza

[step]
Kind = talk_to
Npc = Ilsa Marn
Text = Report back to Ilsa Marn

[quest]
Id = pests_at_the_gate
Title = Pests at the Gate
Giver = Corporal Dask
Requires = stranger_in_mos_eisley
Summary = Worrts and kreetles have been chewing through the moisture lines outside the city. The garrison won't spend troopers on vermin, so Corporal Dask will spend credits on you instead. Worrts nest east and west of the walls; kreetles to the north and south.
Done = "Lines are holding. Good work, civilian." Dask marks something on a datapad.
Credits = 300
Xp = 150
FactionPoints = 25

[step]
Kind = kill
Target = worrt
Count = 5
Text = Kill lesser desert worrts

[step]
Kind = kill
Target = kreetle
Count = 5
Text = Kill kreetles

[step]
Kind = talk_to
Npc = Corporal Dask
Text = Report to Corporal Dask

[quest]
Id = something_for_the_stewpot
Title = Something for the Stewpot
Giver = Bolo Dreel
Requires = stranger_in_mos_eisley
Summary = Bolo Dreel cooks for half the spacers in the city, and he swears by a broth boiled from worrt hide. The junk dealers keep outbidding him for hides. Hunt some fresh ones and bring him four, and he'll pay better than any dealer.
Done = Bolo sniffs the hides, grunts, and drops them straight into the pot.
Credits = 220
Xp = 90
Item = supply_field_rations
Item = supply_field_rations

[step]
Kind = collect
Item = junk_worrt_hide
Count = 4
Text = Collect worrt hides

[step]
Kind = deliver
Item = junk_worrt_hide
Count = 4
Npc = Bolo Dreel
Text = Bring the hides to Bolo Dreel

[quest]
Id = the_valarian_ledger
Title = The Valarian Ledger
Giver = Teska Vo
Requires = stranger_in_mos_eisley
Summary = Teska Vo keeps accounts for a Hutt who would very much like to know where the Valarian Syndicate moves its cargo. Their enforcers carry shipping ledgers. Make the Syndicate's camps feel unsafe, then take a ledger from one of the enforcers. Their outpost is north-east of the city; another camp sits in the dunes to the south-west.
Done = Teska thumbs through the ledger and smiles without showing her teeth. "My employer will be pleased. So will you."
Credits = 450
Xp = 200

[step]
Kind = kill
Target = Valarian Syndicate
Count = 4
Text = Thin out the Valarian Syndicate

[step]
Kind = collect
Item = quest_valarian_ledger
Count = 1
DropFrom = valarian_enforcer
DropChance = 0.6
Text = Take a shipping ledger from a Valarian enforcer

[step]
Kind = deliver
Item = quest_valarian_ledger
Count = 1
Npc = Teska Vo
Text = Bring the ledger to Teska Vo

[quest]
Id = raiders_on_the_ridge
Title = Raiders on the Ridge
Giver = Teska Vo
Requires = the_valarian_ledger
Summary = A caravan carrying her employer's goods was hit far to the south. The tracks lead to a Tusken Raider encampment. Teska wants the raiders taught a lesson and the caravan's manifest back, so her employer knows what was lost.
Done = "Nobody touches what's ours twice." Teska slides you a carbine across the table. "A bonus. Don't spend it all at once."
Credits = 900
Xp = 400
Item = wp_carbine_ee3

[step]
Kind = go_to
Position = 3680 -6950
Radius = 70
Text = Follow the caravan's tracks south to the raiders' camp

[step]
Kind = kill
Target = tusken_raider
Count = 4
Area = 3680 -6950 120
Text = Teach the raiders a lesson

[step]
Kind = collect
Item = quest_caravan_manifest
Count = 1
DropFrom = tusken_raider
DropChance = 0.4
Area = 3680 -6950 120
Text = Recover the caravan's manifest from the raiders

[step]
Kind = deliver
Item = quest_caravan_manifest
Count = 1
Npc = Teska Vo
Text = Bring the manifest to Teska Vo
