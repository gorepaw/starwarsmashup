Id = learning_the_ropes
Title = Learning the Ropes
Level = 1
Giver = Ilsa Marn
Requires = stranger_in_mos_eisley
Summary = Levels come from doing, but the trade's secrets you have to be taught. Ilsa sends you round the trainers: a rifleman's certification from Sergeant Tavel, the scanner and its use from Surveyor Pell, and the crafting stations, where Artisan Tuvi will show you how an extracted lump of ore becomes a blaster.
Done = "A certification, a scanner and a first blaster of your own making," Ilsa says. "That's a start. Dask has a job that needs doing, if you want it."
Credits = 250
Xp = 100
Item = supply_field_rations

