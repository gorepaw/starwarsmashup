; A hub: an open-world city where players queue for battles at war
; terminals. Loaded by swm_server --hub (and net_demo.gd --hub when it hosts).
;
; Positions are Galaxies world coordinates (x z). The battlefield file is
; relative to this file; clients find it by name in game/battlefields/.

[hub]
Name = Mos Eisley
Battlefield = ../battlefields/mos_eisley_outskirts.ini
; Soldiers per team in a battle: bots fill the places players don't.
TeamSize = 8
; Seconds from the first player queueing to the battle starting.
QueueTime = 10
; Seconds a battle stays open after sending its players back.
ReturnDelay = 5

; In the open south-east of the cantina, near where new characters start.
[recruiter]
Name = War Terminal
Position = 3472 -4848
Radius = 4
