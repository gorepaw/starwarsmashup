; A hub: an open-world city where players queue for battles at war
; terminals. Loaded by swm_server --hub (and net_demo.gd --hub when it hosts).
;
; Positions are Galaxies world coordinates (x z). Battlefield files are
; relative to this file; clients find them by name in game/battlefields/.

[hub]
Name = Mos Eisley
; The sides players queue for: every battlefield below has a team by each
; name (in either order).
Sides = Rebellion, Empire
; Each battle is fought on one of these, at random (not the last one
; again): the Galactic Civil War's Battlefront maps, but Mos Eisley's own.
Battlefield = ../battlefields/coruscant.ini
Battlefield = ../battlefields/dagobah.ini
Battlefield = ../battlefields/death_star.ini
Battlefield = ../battlefields/endor.ini
Battlefield = ../battlefields/felucia.ini
Battlefield = ../battlefields/hoth.ini
Battlefield = ../battlefields/jabbas_palace.ini
Battlefield = ../battlefields/kamino.ini
Battlefield = ../battlefields/kashyyyk.ini
Battlefield = ../battlefields/mustafar.ini
Battlefield = ../battlefields/mygeeto.ini
Battlefield = ../battlefields/naboo.ini
Battlefield = ../battlefields/polis_massa.ini
Battlefield = ../battlefields/tantive_iv.ini
Battlefield = ../battlefields/utapau.ini
Battlefield = ../battlefields/yavin.ini
; Soldiers per team in a battle: bots fill the places players don't.
TeamSize = 8
; Seconds from the first player queueing to the battle starting (longer
; while the battle's map is still loading).
QueueTime = 10
; Seconds a battle stays open after sending its players back.
ReturnDelay = 5

; In the open south-east of the cantina, near where new characters start.
[recruiter]
Name = War Terminal
Position = 3472 -4848
Radius = 4
