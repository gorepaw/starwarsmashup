; Rori's wild creatures and outlaws (Stage 13), around its towns (centers from
; datatables/clientregion/rori.iff) and Galaxies' own caves and bunkers (snapshot/rori.ws).
; Positions are Galaxies world coordinates (x z). Templates from the Galaxies files;
; stats scaled as Tatooine's tiers (tatooine_spawns.ini). Rori lies under a global
; water table at 75 m (its swamp): every site is on ground at or above it.

