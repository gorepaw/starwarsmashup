; Star Wars Mashup — Stage 7 1-Step Crafting Schematics & Hub Work Orders
;
; docs/CRAFTING.md. The hand-written [schematic]s below, then the [family]s:
; each makes a schematic for every catalog item it matches (its Kind; an
; Archetype, ArmorClass or ItemSlot; ids matching Match and not Exclude; its
; Faction, neutral unless it says), unless a [schematic] makes it. A weapon,
; armor or a Deflector Shield is made at any Mk up to its crafter's level's.
;
; Weapons, armor and Deflector Shields are blueprints (Blueprint = yes):
; learned from a city quartermaster's blueprint, all but the basics, which
; anyone makes (../items/city_quartermasters.ini [basic]).

