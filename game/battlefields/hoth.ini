; Conquest on Battlefront II's Hoth (Echo Base). The map itself (terrain,
; command posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" hot1 -o game\imported_assets\maps\hot1 --death fall --death Death --open CP7 --team CP3=1 --team CP6=1 --disable atat --disable bombbar
;
; (As its conquest mission does: two death regions, fall and Death, both
; under the ground, below Echo Base's floor and the southern snowfield, for
; whoever falls through it; CP7 removed; CP3 and CP6 handed to the
; attackers; the walkers' and the bombers' AI barriers off.) This file sets
; up the match: teams, their test loadouts and the rules. Battlefront fights
; it with AT-ATs, AT-STs, snowspeeders and tauntauns; until vehicles come,
; it's played on foot.
;
; On Hoth the Empire attacks, and the attacker is Battlefront's team 1: the
; first [team] below. It holds the snowfield (CP6 out on it, CP3 at the
; southern bunker); the Rebellion holds Echo Base (CP4 at the trench bunker
; by its door, CP5 in the main hangar).

[battlefield]
Name = Hoth
Map = ../imported_assets/maps/hot1/hot1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Hoth's minimap image (hoth_map) lies, in Battlefront's x z: under
; its left, top, right and bottom edges. Placed by what it draws: Echo
; Base's two hangars and tunnels, the shield generator and the bunkers fall
; on the map's buildings (the boundary alone made it 17% too big).
Minimap = -640 -506 159 293

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
