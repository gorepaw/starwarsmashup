; Conquest on Battlefront II's Tantive IV, aboard the ship. The map itself
; (command posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" tan1 -o game\imported_assets\maps\tan1 --death turbinedeath --open blastdoor --disable barracks --disable liea
;
; (As its conquest mission does: the turbine's death region, there while it
; turns; the one blast door it removes; the barracks' and Leia's AI
; barriers off. Destroying the turbine's console stops it in Battlefront;
; consoles can't be destroyed yet. The ship has no terrain: under it lies a
; ground no one sees, with a death region over it for whoever falls off.)
; This file sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds CP7 in the round room at the bow end, the Empire CP6 by
; the turbine; CP4 and CP5 start neutral.

[battlefield]
Name = Tantive IV
Map = ../imported_assets/maps/tan1/tan1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Tantive IV's minimap image (tan1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. It's drawn mirrored, x
; running right to left. Placed by what it draws: the posts' rooms and the
; doors' doorways.
Minimap = -190 22 -416 248

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
