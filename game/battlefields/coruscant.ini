; Conquest on Battlefront II's Coruscant, in the Jedi Temple. The map itself
; (command posts, spawn points, boundary, death regions) comes from your own
; install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" cor1 -o game\imported_assets\maps\cor1 --death Death --death Death1 --death Death2 --death Death3 --death Death4 --death DeathRegion1 --disable SideDoor1 --disable MainLibraryDoors --disable SideDoor2 --disable SIdeDoor3 --disable ComputerRoomDoor1 --disable StarChamberDoor1 --disable StarChamberDoor2 --disable WarRoomDoor1 --disable WarRoomDoor2 --disable WarRoomDoor3 --set LibCase1.MaxHealth=1000 --set LibCase2.MaxHealth=1000 --set LibCase3.MaxHealth=1000 --set LibCase4.MaxHealth=1000 --set LibCase5.MaxHealth=1000 --set LibCase6.MaxHealth=1000 --set LibCase7.MaxHealth=1000 --set LibCase8.MaxHealth=1000 --set LibCase9.MaxHealth=1000 --set LibCase10.MaxHealth=1000 --set LibCase11.MaxHealth=1000 --set LibCase12.MaxHealth=1000 --set LibCase13.MaxHealth=1000 --set LibCase14.MaxHealth=1000
;
; (As its conquest mission sets it up: the death regions over the drops
; outside the temple and under its floors; the doors' AI barriers it takes
; down. The doors themselves are only in the campaign's layer, so in
; conquest the doorways stand open: its DoorOpen01 and DoorOpen02, raising
; them at the start, have nothing to move. The library's shelves it sets to
; 1,000 health, against their class's 6,300.) The temple has no terrain: under it lies a
; ground no one sees, with a death region over it for whoever falls. This
; file sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds CP5, in the round room off the grand hall's side, the
; Empire CP6, up the stairs at the statue corridor's end; the other four
; (CP1 in the library, CP2 at the grand hall's domed end, CP3 in the round
; room off the statue corridor, CP4 in the other round room off the hall)
; start neutral.

[battlefield]
Name = Coruscant
Map = ../imported_assets/maps/cor1/cor1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Coruscant's minimap image (cor1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by what it draws: the
; statue corridor, the round rooms at CP3 and CP4, the dome at CP2; the
; grand hall's floor and pillars agree.
Minimap = -100 -196 135 39

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
