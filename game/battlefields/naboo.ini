; Conquest on Battlefront II's Naboo (Theed). The map itself (terrain,
; command posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" nab2 -o game\imported_assets\maps\nab2 --death Waterfall --disable camveh --disable turbar1 --disable turbar2 --disable turbar3 --disable cambar1 --disable cambar2 --disable cambar3
;
; (As its conquest mission does: one death region, Waterfall, over the
; falls past the north edge; the turret and camera barriers off.) This
; file sets up the match: teams, their test loadouts and the rules.
; Battlefront fights it with fighter tanks and combat speeders, its laser
; turrets manned by either side, and the Gungans as a third side that can't
; take posts (not here yet: it's played by two). Export the vehicles and the
; turret too (Vehicles below names where they go):
;
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" imp imp_hover_fightertank -o game\imported_assets\vehicles\imp_hover_fightertank
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" all all_hover_combatspeeder -o game\imported_assets\vehicles\all_hover_combatspeeder
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" tur tur_bldg_laser -o game\imported_assets\vehicles\tur_bldg_laser
;
; The Empire (attacking) gets hover tanks by its posts, the Rebellion
; (defending) combat speeders; the nine turrets stand for whoever gets in.
;
; On Naboo the Empire is Battlefront's team 1: the first [team] below. It
; holds the west and north (CP1, CP6, and CP4 at the rotunda by the
; falls); the Rebellion holds the east and the middle (CP3, CP5 between
; the domes, CP2 in the plaza under the arcade).

[battlefield]
Name = Naboo
Map = ../imported_assets/maps/nab2/nab2_conquest.ini
Vehicles = ../imported_assets/vehicles
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Naboo's minimap image (naboo2_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by what it draws: the
; rotunda and the fountains' rings fall on the map's fountains, the
; palace's dome on the palace.
Minimap = -212 -176 218 254

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
