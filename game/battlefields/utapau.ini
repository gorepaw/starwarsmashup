; Conquest on Battlefront II's Utapau, on the sinkhole city's platforms and
; walkways round the great pit. The map itself (command posts, spawn
; points, boundary, death region) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" uta1 -o game\imported_assets\maps\uta1 --death deathregion --disable Barrier445
;
; (As its conquest mission sets it up: its death region; the AI barrier it
; takes down. It leaves the posts as the map has them.) Battlefront fights
; it with combat speeders, hover tanks and droid starfighters; until
; vehicles come, it's played on foot. The city has no terrain: under it
; lies a ground no one sees, and whoever falls that far dies.
; This file sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds CON_CP1, the Empire CON_CP5; the other four start
; neutral.

[battlefield]
Name = Utapau
Map = ../imported_assets/maps/uta1/uta1_conquest.ini
; Its vehicles and turrets (the map's spawns): the attacking Rebellion's combat speeders, the defending Empire's hover tanks. Export each:
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" <side> <class> -o game\imported_assets\vehicles\<class>
; for all all_hover_combatspeeder, imp imp_hover_fightertank. A spawn whose class isn't exported is left out.
Vehicles = ../imported_assets/vehicles
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Utapau's minimap image (uta1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by the city's floors
; against the walkways it draws light: the crescent round the pit, the
; teeth along its outer edge and the great hall agree.
Minimap = -266.9 -35.5 187.8 419.2

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
