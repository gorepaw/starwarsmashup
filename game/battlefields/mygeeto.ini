; Conquest on Battlefront II's Mygeeto, in the ruined city's plazas and
; bridges. The map itself (command posts, spawn points, its death region)
; comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" myg1 -o game\imported_assets\maps\myg1 --death deathregion --disable dropship --disable shield_03 --disable shield_02 --disable shield_01 --disable ctf --disable ctf1 --disable ctf2 --disable ctf3 --disable coresh1
;
; (As its conquest mission sets it up: its death region, under the city's
; floors; the AI barriers it takes down; its five posts. It has no
; boundary.) Battlefront fights it with combat speeders, hover tanks and
; walkers; until vehicles come, it's played on foot. The city has no
; terrain: under it lies a ground no one sees. This file sets up the match:
; teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds CP1 (at the city's far end) and CP7 (between the
; bridges), the Empire CP2 (on the round platform) and CP5; CP4, by the
; great plaza's ring, starts neutral.

[battlefield]
Name = Mygeeto
Map = ../imported_assets/maps/myg1/myg1_conquest.ini
; Its other Battlefront modes in this era (their layers: bf2tool export-map
; --mode <mode> --layer <the mission's layer>, its flags and capture regions
; with --flag / --flag-capture, read off the mission script):
Mode = ctf ../imported_assets/maps/myg1/myg1_ctf.ini
; Its vehicles and turrets (the map's spawns): the attacking Rebellion's combat speeders, the defending Empire's hover tanks, and the recoilless turrets. Export each:
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" <side> <class> -o game\imported_assets\vehicles\<class>
; for all all_hover_combatspeeder, imp imp_hover_fightertank, tur tur_bldg_recoilless_lg. A spawn whose class isn't exported is left out.
Vehicles = ../imported_assets/vehicles
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Mygeeto's minimap image (myg1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by the round
; platform and the great plaza's ring; the bridges and the far end agree.
Minimap = -334.6 -198.8 218.4 354.2

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
