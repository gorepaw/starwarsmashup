; Conquest on Battlefront II's Kashyyyk. The map itself (terrain, command
; posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" kas2 -o game\imported_assets\maps\kas2 --open woodl --open woodc --open woodr
;
; (Its conquest mission adds no death regions; the sea is shallow enough to
; wade. The wooden barricades in the fort's inner wall are fought open in
; Battlefront; until things can be destroyed, --open leaves them out, as if
; already destroyed, or the Empire could never reach CP4 and CP5. The sea
; wall's gate stays shut, as it starts.) This file sets up the match: teams, their test loadouts and the
; rules. Battlefront fights it with hover tanks, speeder bikes and Wookiee
; warriors on the Rebellion's side; until vehicles and allies come, it's
; played on foot.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds the sea wall (CP5) and the fort behind it (CP4), the
; Empire the far shore (CP3) and the Wookiee tree platforms (CP1).

[battlefield]
Name = Kashyyyk
Map = ../imported_assets/maps/kas2/kas2_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Kashyyyk's minimap image (kas2_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Fitted to the sea (the
; image's light band against the terrain under the water: 91% overlap);
; its posts fall on the sea wall, the shore and the tree platforms.
Minimap = -106 -279 410 236

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
