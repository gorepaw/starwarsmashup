; Conquest on Battlefront II's Jabba's Palace, on Tatooine. The map itself
; (command posts, spawn points, boundary, the rancor pit's pool) comes from
; your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" tat3 -o game\imported_assets\maps\tat3
;
; (Its conquest mission adds no death regions and takes down no barriers.
; It also sets Jabba's Gamorrean guards on everyone, a third side: they
; wait for a third team.) The palace has no terrain: under it lies a ground
; no one sees, with a death region over it for whoever falls. This file
; sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Empire holds CP1, in the long hall, the Rebellion CP4, down in the rancor
; pit; CP2 (by the throne room), CP3 (in the round hall) and CP5 start
; neutral.

[battlefield]
Name = Jabba's Palace
Map = ../imported_assets/maps/tat3/tat3_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Jabba's Palace's minimap image (tat3_map) lies, in Battlefront's x
; z: under its left, top, right and bottom edges. Fitted to the palace's
; outline; the rancor pit, the round hall and the long hall agree.
Minimap = -148 28 32 208

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

; Its locals, as the conquest script sets them up: 2 Gamorrean guards,
; enemies of both sides (SetTeamAsEnemy both ways). The map gives them no
; ally spawn points, so they come out at the neutral posts (ASSUMPTION).
; They fight with an axe in Battlefront; here a blaster pistol
; (../loadouts/native_gamorrean.ini).
[natives]
Name = Gamorrean guards
Look = gamorrean
Count = 2
Loadout = ../loadouts/native_gamorrean.ini
