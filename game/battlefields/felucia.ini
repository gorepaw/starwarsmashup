; Conquest on Battlefront II's Felucia. The map itself (terrain, command
; posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" fel1 -o game\imported_assets\maps\fel1
;
; (Its conquest mission adds no death regions; the playable area is four
; overlapping rings, the boundaries the map lists.) This file sets up the
; match: teams, their test loadouts and the rules. Battlefront fights it
; with AT-STs and combat speeders; until vehicles come, it's played on foot.
;
; Battlefront's team 1 is the first [team] below, team 2 the second. Its
; conquest mission (fel1g_con) makes the Empire team 1 (IMP = 1, ALL = 2)
; and the attacker: the Empire holds the west and the middle (CP1, CP3,
; CP5), the Rebellion the east: the cliff top (CP2), the ravine (CP4) and
; the forward base (CP6).

[battlefield]
Name = Felucia
Map = ../imported_assets/maps/fel1/fel1_conquest.ini
; Its other Battlefront modes in this era (their layers: bf2tool export-map
; --mode <mode> --layer <the mission's layer>, its flags and capture regions
; with --flag / --flag-capture, read off the mission script):
Mode = 1flag ../imported_assets/maps/fel1/fel1_1flag.ini
; Its vehicles and turrets (the map's spawns): the attacking Empire's AT-ST, the defending Rebellion's combat speeders. Export each:
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" <side> <class> -o game\imported_assets\vehicles\<class>
; for all all_hover_combatspeeder, imp imp_walk_atst. A spawn whose class isn't exported is left out.
Vehicles = ../imported_assets/vehicles
; Battlefront's mission has the Empire attack here (the map's spawns say so).
Attacker = Empire
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Felucia's minimap image (fel1_map) lies, in Battlefront's x z: under
; its left, top, right and bottom edges. Fitted to the map's boundary rings
; (84% overlap with the image's light outline).
Minimap = -174 -203 200 171

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
