; A conquest battlefield: the basin east of Mos Eisley's cantina, up to the
; mesa slope. Loaded by swbfo_server --battlefield and by the clients (they must
; use the same file).
;
; Positions are Galaxies world coordinates (x z), as `swgtool snapshot` and
; walk_building.gd print them. Loadout files are relative to this file.
;
; Each team offers test loadouts until the hub sends each player's own gear:
; Battlefront II kits exported from your own install (tools/README.md,
; export-loadout; never committed), and ours in game/loadouts/.
;
; Post timings are Battlefront's com_bldg_controlzone: NeutralizeTime 12 s,
; CaptureTime 10 s (the defaults). Capture regions are ours (Battlefront sets
; them per map).

[battlefield]
Name = Mos Eisley Outskirts
; min_x min_z max_x max_z
Bounds = 3330 -4960 3990 -4600
; Reinforcements per team: each death costs one.
Tickets = 150
; Seconds of practice before the match goes live, and of results after it.
Warmup = 15
Results = 15
; Seconds a team must hold every post to win.
VictoryTime = 20
; Tickets a second the other team loses, per post of lead.
Bleed = 0.1
; Seconds outside the bounds before dying.
OutOfBoundsTime = 10
MinPlayers = 1

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
; The Rebel officer's kit (incinerator, buffs) has no supported weapons yet.
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[post]
Name = Cantina Square
Position = 3395 -4765
Owner = Empire

[post]
Name = Mesa Slope
Position = 3800 -4648

[post]
Name = Dune Sea Road
Position = 3665 -4775
Radius = 12

[post]
Name = Moisture Farm
Position = 3770 -4890

[post]
Name = Rebel Outpost
Position = 3925 -4770
Owner = Rebellion
