; A conquest battlefield: the basin east of Mos Eisley's cantina, up to the
; mesa slope. Loaded by swm_server --battlefield and by the clients (they must
; use the same file).
;
; Positions are Galaxies world coordinates (x z), as `swgtool snapshot` and
; walk_building.gd print them. Class files are relative to this file; they're
; exported from your own Battlefront II install (see tools/README.md,
; export-soldier) and never committed.
;
; Post timings are Battlefront's com_bldg_controlzone: NeutralizeTime 12 s,
; CaptureTime 10 s (the defaults). Capture regions are ours (Battlefront sets
; them per map).

[battlefield]
Name = Mos Eisley Outskirts
; min_x min_z max_x max_z
Bounds = 3330 -4960 3990 -4600
; Reinforcements per team: each death costs one.
Tickets = 150
; Seconds of practice before the match goes live, and of results after it.
Warmup = 15
Results = 15
; Seconds a team must hold every post to win.
VictoryTime = 20
; Tickets a second the other team loses, per post of lead.
Bleed = 0.1
; Seconds outside the bounds before dying.
OutOfBoundsTime = 10
MinPlayers = 1

[team]
Name = Empire
Class = ../imported_assets/combat/imp_inf_rifleman.ini
Class = ../imported_assets/combat/imp_inf_engineer.ini
Class = ../imported_assets/combat/imp_inf_sniper.ini

[team]
Name = Rebellion
Class = ../imported_assets/combat/all_inf_rifleman.ini
Class = ../imported_assets/combat/all_inf_engineer.ini
Class = ../imported_assets/combat/all_inf_sniper.ini

[post]
Name = Cantina Square
Position = 3395 -4765
Owner = Empire

[post]
Name = Mesa Slope
Position = 3800 -4648

[post]
Name = Dune Sea Road
Position = 3665 -4775
Radius = 12

[post]
Name = Moisture Farm
Position = 3770 -4890

[post]
Name = Rebel Outpost
Position = 3925 -4770
Owner = Rebellion
