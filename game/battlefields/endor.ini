; Conquest on Battlefront II's Endor. The map itself (terrain, command
; posts, spawn points, boundary, death region) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" end1 -o game\imported_assets\maps\end1 --death deathregion
;
; (--death names the death regions its conquest mission adds: a pit by the
; bunker.) This file sets up the match: teams, their test loadouts and the
; rules. Battlefront fights it with AT-STs and speeder bikes; until vehicles
; come, it's played on foot.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds the forest (CP2, CP5, CP10), the Empire the shield
; generator's bunker (CP1) and the clearings by it.

[battlefield]
Name = Endor
Map = ../imported_assets/maps/end1/end1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Endor's minimap image (end1_map) lies, in Battlefront's x z: under
; its left, top, right and bottom edges. Fitted to the map's boundary path
; (58% overlap with the image's light outline, which is ragged where the
; boundary is a hexagon); its posts fall on the bunker and the Ewok
; village walkways the image shows.
Minimap = -410 -315 442 538

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
