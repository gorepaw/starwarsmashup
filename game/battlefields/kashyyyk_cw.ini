; Clone Wars Conquest on Battlefront II's Kashyyyk: the same map
; export as kashyyyk.ini (its Galactic Civil War battle), fought between the
; Republic and the Separatists. As kas2c_con (the Clone Wars conquest
; mission) numbers them, Battlefront's team 1 is the Republic (the
; first [team] below, holding the posts the map gives team 1, and
; attacking), team 2 the Separatists. The mission sets the posts' teams, death
; regions, barriers and doors as the GCW one does (decoded from
; mission.lvl), so the GCW export serves both eras. The clones' kits
; (rep_inf_ep3_*) and the droids' come from your install: tools/README.md.

[battlefield]
Name = Kashyyyk
Map = ../imported_assets/maps/kas2/kas2_conquest.ini
; Its other Battlefront modes in this era (their layers: bf2tool export-map
; --mode <mode> --layer <the mission's layer>, its flags and capture regions
; with --flag / --flag-capture, read off the mission script):
Mode = ctf ../imported_assets/maps/kas2/kas2_ctf.ini
Mode = hunt ../imported_assets/maps/kas2/kas2_hunt.ini
Mode = xl ../imported_assets/maps/kas2/kas2_xl.ini
; Its vehicles and turrets (the map's spawns): the Rebellion's combat speeders and speeder bikes, the Empire's hover tanks and speeder bikes, and the beach's turrets (the recoilless ones without guns yet). Export each:
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" <side> <class> -o game\imported_assets\vehicles\<class>
; for all all_hover_combatspeeder, imp imp_hover_speederbike, imp imp_hover_fightertank, tur tur_bldg_beam, tur tur_bldg_recoilless_kas. A spawn whose class isn't exported is left out.
Attacker = Republic
Vehicles = ../imported_assets/vehicles
; What team 2 wants destroyed: the sea-wall gate's panel (the
; script's "gate open" objective) and the fort's wooden barricades. Its
; bots, with no one to shoot, shoot them when they see them.
Objective = gatepanel 2
Objective = woodl 2
Objective = woodc 2
Objective = woodr 2
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Kashyyyk's minimap image (kas2_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Fitted to the sea (the
; image's light band against the terrain under the water: 91% overlap);
; its posts fall on the sea wall, the shore and the tree platforms.
Minimap = -100 -263 404 240

[team]
Name = Republic
Loadout = ../imported_assets/loadouts/rep_inf_ep3_rifleman.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep3_rocketeer.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep3_sniper.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep3_engineer.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep3_officer.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep3_jettrooper.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Separatists
Loadout = ../imported_assets/loadouts/cis_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/cis_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/cis_inf_sniper.ini
Loadout = ../imported_assets/loadouts/cis_inf_engineer.ini
Loadout = ../imported_assets/loadouts/cis_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[natives]
Name = Wookiees
Look = species:wookiee
Count = 5
Friends = 1
Loadout = ../imported_assets/loadouts/wok_inf_warrior.ini
Loadout = ../imported_assets/loadouts/wok_inf_mechanic.ini
