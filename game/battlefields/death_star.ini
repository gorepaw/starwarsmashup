; Conquest on Battlefront II's Death Star, inside the battle station. The
; map itself (command posts, spawn points, death regions) comes from your
; own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" dea1 -o game\imported_assets\maps\dea1 --death DeathRegion01 --death DeathRegion02 --death DeathRegion03 --death DeathRegion04 --death DeathRegion05 --disable start_room_barrier --disable dr_left --disable circle_bar1 --disable circle_bar2 --disable bridgebarrier --disable barrier222 --drop-boundary boundary --kill-plays Panel-Chasm=bridgeclose --kill-plays Panel-Tak=takbridgeopen --timed-death deathregion=7,5,15
;
; (As its conquest mission does: the chasms' death regions; the AI
; barriers it takes down at the start, among them those of the two bridges
; it extends; destroying a bridge's panel (Panel-Chasm, Panel-Tak, 80
; health) draws its bridge back, until the next match (Battlefront's
; engineers rebuild them). The trash compactor's death region comes and
; goes on its timer, on 7 s in for 5 s, off for 15, while its walls close
; (their loop keeps to the battle's clock). Its boundary is left out: it cuts through the station's south end,
; where CP3 and CP4 are, and the station, sealed, with its falls death
; regions, needs none. The station has no terrain: under it lies a ground
; no one sees, with a death region over it for whoever falls.)
; This file sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds CP4, CP5 and CP7 (the hangar), the Empire CP1, CP2 and
; CP3.

[battlefield]
Name = Death Star
Map = ../imported_assets/maps/dea1/dea1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where the Death Star's minimap image (dea1_map) lies, in Battlefront's x
; z: under its left, top, right and bottom edges. Placed by what it draws:
; the hub's round room, the long corridor, the reactor room's walls.
Minimap = -283 -300 46 29

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
