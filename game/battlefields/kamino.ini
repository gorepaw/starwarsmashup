; Conquest on Battlefront II's Kamino, on Tipoca City's platforms over the
; sea. The map itself (command posts, spawn points, boundary) comes from your
; own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" kam1 -o game\imported_assets\maps\kam1 --team cp1=1 --team cp2=2 --team cp3=2 --team cp4=2 --team cp5=1 --team cp6=1 --disable camp --disable frog --disable close --disable open --disable FRONTDOOR2-3 --disable FRONTDOOR2-1 --disable FRONTDOOR2-2 --disable FRONTDOOR1-3 --disable FRONTDOOR1-1 --disable FRONTDOOR1-2 --set Kam_Bldg_Podroom_Door32.IsLocked=1 --set Kam_Bldg_Podroom_Door33.IsLocked=1 --set Kam_Bldg_Podroom_Door34.IsLocked=1 --set Kam_Bldg_Podroom_Door35.IsLocked=1 --set Kam_Bldg_Podroom_Door27.IsLocked=0 --set Kam_Bldg_Podroom_Door28.IsLocked=1 --set Kam_Bldg_Podroom_Door36.IsLocked=1 --set Kam_Bldg_Podroom_Door20.IsLocked=0 --set cp2.SpawnPath=cp2_spawn --set cp2.CaptureRegion=cp2_capture
;
; (As its conquest mission sets it up: each post's team; the AI barriers it
; takes down; the pod rooms' doors it locks, shut (the others open as
; soldiers come, and are left open until they move); CP2's spawn path and
; capture region, the ones it has. It adds no death regions.) Tipoca City
; has no terrain: under it lies the sea, and under that a ground no one
; sees. Soldiers who fall into the sea die once they're under it.
; This file sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds cp1 (in one of the two great halls), CP5 and cp6 (in the
; pods), the Empire cp2 (in the other hall), cp3 and CP4.

[battlefield]
Name = Kamino
Map = ../imported_assets/maps/kam1/kam1_conquest.ini
; Its vehicles and turrets (the map's spawns): its gun turrets. Export each:
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" <side> <class> -o game\imported_assets\vehicles\<class>
; for tur tur_weap_built_gunturret. A spawn whose class isn't exported is left out.
Vehicles = ../imported_assets/vehicles
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Kamino's minimap image (kamino1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by CP5's and cp3's
; pods; the other pods and the two halls agree.
Minimap = -300 -171.5 253 381.5

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
