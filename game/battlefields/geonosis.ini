; Conquest on Battlefront II's Geonosis (Clone Wars). The map itself
; (terrain, command posts, spawn points, boundary) comes from your own
; install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" geo1 -o game\imported_assets\maps\geo1 --death deathregion --death deathregion2 --death deathregion3 --death deathregion4 --death deathregion5
;
; (Its conquest mission adds five death regions: the canyon's floor on the
; west side, and four small ones under the ground, one down a Geonosian
; vent's shaft, the others below vents for whoever falls through.) This file sets up the match:
; teams, their test loadouts and the rules. Battlefront fights it with
; AT-TEs, gunships, hailfire droids and spider droids, and the Geonosians
; as a third side; until vehicles and a third team come, it's two armies on
; foot. The Republic's and the Separatists' kits come from your install
; too (bf2tool export-loadout: tools/README.md has the commands). The jet
; trooper has no jetpack yet: only its kit.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Republic holds the south (cp3 by the crashed core ship, cp6, cp7), the
; Separatists the north (cp1, CP2 at the hangar, CP8); cp4, the bunker on
; the ridge, starts neutral.

[battlefield]
Name = Geonosis
Map = ../imported_assets/maps/geo1/geo1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Geonosis's minimap image (geo1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by what it draws: the
; round bunkers' rings, the hangar and the core ship's hull fall on the
; map's objects. It shows the middle of the battlefield, not all of it.
Minimap = -189 -124 259 324

[team]
Name = Republic
Loadout = ../imported_assets/loadouts/rep_inf_ep2_rifleman.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep2_rocketeer.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep2_sniper.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep2_engineer.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep3_officer.ini
Loadout = ../imported_assets/loadouts/rep_inf_ep2_jettrooper.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Separatists
Loadout = ../imported_assets/loadouts/cis_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/cis_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/cis_inf_sniper.ini
Loadout = ../imported_assets/loadouts/cis_inf_engineer.ini
Loadout = ../imported_assets/loadouts/cis_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
