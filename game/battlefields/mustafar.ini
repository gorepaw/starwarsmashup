; Conquest on Battlefront II's Mustafar, in the mining facility over the
; lava. The map itself (command posts, spawn points, the lava's damage
; regions) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" mus1 -o game\imported_assets\maps\mus1 --disable 1 --disable BALCONEY --disable bALCONEY2 --disable hallway_f --disable hackdoor --disable outside --disable Bridge --kill-plays DingDong=lava_bridge_drop
;
; (As its conquest mission sets it up: the AI barriers it takes down, the
; lava bridge's among them; it raises the bridge at the start, and lowers it
; into the lava when its console (DingDong) is destroyed: whoever's on it
; goes in. Battlefront raises it again when an engineer rebuilds the
; console; with no engineers, it stays down until the next match. The lava
; kills through the map's own damage
; regions, always on.) The facility has no terrain and no boundary: under it
; lies a ground no one sees, with a death region over it for whoever falls.
; This file sets up the match: teams, their test loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds CP1 (on the landing platform), CP3 and CP6, the Empire CP2
; (out by the collector arms), CP4 and CP5.

[battlefield]
Name = Mustafar
Map = ../imported_assets/maps/mus1/mus1_conquest.ini
; Its other Battlefront modes in this era (their layers: bf2tool export-map
; --mode <mode> --layer <the mission's layer>, its flags and capture regions
; with --flag / --flag-capture, read off the mission script):
Mode = ctf ../imported_assets/maps/mus1/mus1_ctf.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Mustafar's minimap image (mus1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Placed by the landing
; platform; the halls and the collector arms agree.
Minimap = -131.6 -86.5 124.4 169.5

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
