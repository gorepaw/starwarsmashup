; Conquest on Battlefront II's Yavin 4 (the temple). The map itself (terrain,
; command posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" yav1 -o game\imported_assets\maps\yav1 --death death1
;
; (Its conquest mission adds one death region, death1: the plateau above the
; valley's west wall, for whoever climbs out. The river is shallow enough to
; wade.) This file sets up the
; match: teams, their test loadouts and the rules. Battlefront fights it with
; the Empire's hover tanks and the Rebellion's combat speeders, each with a
; gunner's seat: export them too (Vehicles below names where they go):
;
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" imp imp_hover_fightertank -o game\imported_assets\vehicles\imp_hover_fightertank
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" imp imp_hover_speederbike -o game\imported_assets\vehicles\imp_hover_speederbike
;   bf2tool export-vehicle "<Battlefront>\GameData\Data\_lvl_pc" all all_hover_combatspeeder -o game\imported_assets\vehicles\all_hover_combatspeeder
;
; Battlefront's mission has the Empire attack here (Attacker below): the
; map's spawns give the attacking Empire tanks and a bike, the defending
; Rebellion combat speeders and a bike. A spawn whose class isn't exported
; is left out.
;
; Battlefront's team 1 is the first [team] below, team 2 the second. Its
; mission has the Empire (team 1) attack the Rebellion's temple: the Empire
; holds the south (the landing zone, the bazaar by the river and the
; viaduct), the Rebellion the north (the temple, the reflecting pool and the
; flank by the ruins); the ruins' plaza in the middle (CP1) starts neutral.
; (The map's vehicle spawns say so: the Empire's tanks at the landing zone,
; the Rebellion's combat speeders by the temple.)

[battlefield]
Name = Yavin 4
Map = ../imported_assets/maps/yav1/yav1_conquest.ini
; Its other Battlefront modes in this era (their layers: bf2tool export-map
; --mode <mode> --layer <the mission's layer>, its flags and capture regions
; with --flag / --flag-capture, read off the mission script):
Mode = 1flag ../imported_assets/maps/yav1/yav1_1flag.ini
Vehicles = ../imported_assets/vehicles
Attacker = Empire
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Yavin's minimap image (yavin1_map) lies, in Battlefront's x z: under
; its left, top, right and bottom edges. Placed by what it draws: the
; temple's octagon, the viaduct, the bazaar's ring and the grid of ruins
; fall on the map's objects and posts (the boundary alone put it 35 m west).
Minimap = -217 -528 457 147

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
