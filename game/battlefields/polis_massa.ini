; Conquest on Battlefront II's Polis Massa. The map itself (terrain,
; command posts, spawn points, boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" pol1 -o game\imported_assets\maps\pol1 --death deathregion1
;
; (Its conquest mission adds one death region, deathregion1, under the
; ground below the round hall, for whoever falls through it. It also shuts
; the airlock by CP5 while its console is destroyed; consoles can't be
; destroyed yet, so it stays as the map has it. The doors, which open as
; soldiers come, are left open until they move.) This file sets up the match: teams, their test loadouts
; and the rules. Battlefront fights it with combat speeders; until vehicles
; come, it's played on foot.
;
; Battlefront's team 1 is the first [team] below, team 2 the second: the
; Rebellion holds the east and the round hall (CP1, CP4, CP6), the Empire
; the west (CP2 in the hall's corridor, CP3, CP5 by the airlock).

[battlefield]
Name = Polis Massa
Map = ../imported_assets/maps/pol1/pol1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Polis Massa's minimap image (pol1_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Fitted to the boundary; what
; it draws agrees (CP6 in the east building's oval room, CP1 in the round
; hall, the doors on the corridors, within some 6 m).
Minimap = -263 -287 247 223

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
