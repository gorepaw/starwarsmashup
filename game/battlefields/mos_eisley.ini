; Conquest on Battlefront II's Mos Eisley, in the spaceport's streets and
; docking bays on Tatooine. The map itself (command posts, spawn points,
; boundary) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" tat2 -o game\imported_assets\maps\tat2
;
; (Its conquest mission adds no death regions and takes down no barriers.
; It locks a door, FDL-2, that isn't in the map. It also brings in the
; Jawas, a third side friendly to both: they wait for a third team.) Its
; conquest takes the turrets' layer too; until turrets can be manned,
; they're props. This file sets up the match: teams, their test loadouts
; and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second (the
; script's ALL = 2, IMP = 1): the Empire holds CP1, CP2 and CP8, the
; Rebellion CP3, CP6 and CP7.

[battlefield]
Name = Mos Eisley
Map = ../imported_assets/maps/tat2/tat2_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Mos Eisley's minimap image (tat2_map) lies, in Battlefront's x z:
; under its left, top, right and bottom edges. Fitted to the boundary; the
; docking bay and the rows of buildings agree.
Minimap = -151 -177 169 142

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

; Its locals, as the conquest script sets them up (SetTeamName "locals",
; SetTeamAsFriend both ways with both sides): 7 Jawas, friends of everyone,
; spawning at any post's AllyPath. They carry an arc caster in Battlefront;
; here a pistol they never fire (../loadouts/native_jawa.ini).
[natives]
Name = Jawas
Look = jawa
Count = 7
Friends = 1 2
Loadout = ../loadouts/native_jawa.ini
