; Conquest on Battlefront II's Dagobah. The map itself (terrain, command
; posts, spawn points, bounds) comes from your own install:
;
;   bf2tool export-map "<Battlefront>\GameData\Data\_lvl_pc" dag1 -o game\imported_assets\maps\dag1 --skip dag1_gunship
;
; (--skip leaves out the Clone Wars era's crashed gunship; the X-wing is the
; Galactic Civil War's.) This file sets up the match: teams, their test
; loadouts and the rules.
;
; Battlefront's team 1 is the first [team] below, team 2 the second.
; ASSUMPTION: in the Galactic Civil War era team 1 is the Rebellion (it
; starts at CP3, south) and team 2 the Empire (CP1, north).

[battlefield]
Name = Dagobah
Map = ../imported_assets/maps/dag1/dag1_conquest.ini
Tickets = 150
Warmup = 15
Results = 15
VictoryTime = 20
Bleed = 0.1
OutOfBoundsTime = 10
MinPlayers = 1
; Where Dagobah's minimap image (dag1_map) lies, in Battlefront's x z: under
; its left, top, right and bottom edges. Fitted to the map's playable outline
; (the hell_bush path), which its light area matches (92% overlap). The
; image is 356 m square, north up, east right.
Minimap = -122 -168 234 188

[team]
Name = Rebellion
Loadout = ../imported_assets/loadouts/all_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/all_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/all_inf_sniper.ini
Loadout = ../imported_assets/loadouts/all_inf_engineer.ini
Loadout = ../loadouts/test_heavy_trooper.ini

[team]
Name = Empire
Loadout = ../imported_assets/loadouts/imp_inf_rifleman.ini
Loadout = ../imported_assets/loadouts/imp_inf_rocketeer.ini
Loadout = ../imported_assets/loadouts/imp_inf_sniper.ini
Loadout = ../imported_assets/loadouts/imp_inf_engineer.ini
Loadout = ../imported_assets/loadouts/imp_inf_officer.ini
Loadout = ../loadouts/test_heavy_trooper.ini
