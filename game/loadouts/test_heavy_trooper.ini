; A test loadout: what a player might bring into a battle. Characters have no
; classes; their weapons and gear decide what they can do and how much damage
; they take. Until the hub sends each player's own gear, battlefields offer
; test loadouts like this one.
;
; Primary and Sidearm are held (1 and 2 switch between them); Secondary is a
; throwable or gadget with its own button. Gear can repeat, one piece per
; slot. Each names an item file (<name>.ini) in the Items folders: by default
; ../items (ours, committed) and ../imported_assets/items (weapons exported
; from your Battlefront II install by bf2tool export-loadout).

[loadout]
Name = test heavy trooper
Primary = imp_weap_inf_rifle
Sidearm = imp_weap_inf_pistol
Secondary = imp_weap_inf_thermaldetonator
Gear = test_heavy_armor
